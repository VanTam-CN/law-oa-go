# Grafana Prometheus数据源配置
apiVersion: 1

# 数据源列表
datasources:
  # Prometheus数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # 时间间隔
      timeInterval: "15s"
      # 查询超时
      queryTimeout: "60s"
      # HTTP方法
      httpMethod: POST
      # 数据库设置
      database: prometheus
      # 填充模式
      fill: 1
      # 结果窗口设置
      resultWindow: 60
    secureJsonData: {}
    version: 1

  # MySQL数据源
  - name: MySQL
    type: mysql
    access: proxy
    url: mysql:3306
    database: law_oa_prod
    user: grafana
    password: "${GRAFANA_MYSQL_PASSWORD}"
    editable: true
    jsonData:
      # 连接参数
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: "${GRAFANA_MYSQL_PASSWORD}"
    version: 1

  # Redis数据源
  - name: Redis
    type: redis
    access: proxy
    url: redis:6379
    database: 0
    password: "${REDIS_PASSWORD}"
    editable: true
    jsonData:
      # 连接池设置
      poolSize: 10
      # 超时设置
      timeout: 10
      # 管道超时
      pipelineWindow: 0
    secureJsonData:
      password: "${REDIS_PASSWORD}"
    version: 1

  # Loki日志数据源
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # 最大日志行数
      maxLines: 1000
      # 日志级别映射
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
    secureJsonData: {}
    version: 1

  # Jaeger链路追踪（如果启用）
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      # 追踪设置
      tracesToLogs: false
      tracesToMetrics: false
      nodeGraph: true
    secureJsonData: {}
    version: 1