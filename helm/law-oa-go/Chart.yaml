# Law OA Go - 企业级Helm Chart配置
# 基于最新Helm 3最佳实践和生产环境优化策略

apiVersion: v2
name: law-oa-go
description: Law OA Go - 律师事务所办公自动化系统
type: application
deprecated: true
version: 2.1.0
appVersion: "2.1.0"

# Chart元数据
home: https://github.com/law-oa/law-oa-go
sources:
  - https://github.com/law-oa/law-oa-go
  - https://docs.lawoa.com
maintainers:
  - name: Law OA Team
    email: team@lawoa.com
    url: https://lawoa.com

# 依赖关系
# 该弃用 Chart 不捆绑任何基础设施依赖；外部数据库、Redis、搜索和监控
# 必须由 canonical manifests 或集群管理员单独提供。
dependencies: []

# 关键词
keywords:
  - law
  - oa
  - office
  - automation
  - management
  - golang
  - microservices
  - enterprise

# 注解
annotations:
  category: Business
  deprecation: "Use the canonical PostgreSQL manifests under k8s/ instead."
  licenses: MIT
  images: |
    - name: law-oa-go
      image: law-registry.com/law-oa-go:2.1.0
  documentation: https://docs.lawoa.com
  changelog: https://github.com/law-oa/law-oa-go/blob/main/CHANGELOG.md
