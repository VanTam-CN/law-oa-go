# Legacy manifest marker
#
# This file intentionally contains no Deployment, Service, Ingress or Secret.
# The former all-in-one manifest used an application without the production
# schema bootstrap and could create a second, conflicting backend. Use the
# canonical manifests under k8s/namespaces, k8s/configmaps,
# k8s/secrets, k8s/deployments, k8s/services and
# k8s/persistentvolumeclaims instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: law-oa-legacy-manifest-warning
  namespace: law-oa
  labels:
    app: law-oa
    component: deployment-metadata
    environment: production
  annotations:
    law-oa-go/canonical-manifest: "k8s/deployments/backend.yaml"
data:
  message: "Deprecated manifest. Apply the documented canonical production manifests instead."
