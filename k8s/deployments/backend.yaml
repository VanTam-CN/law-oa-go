---
# Law OA Go 后端应用部署 - 企业级Kubernetes配置
# 基于最新Kubernetes最佳实践和生产环境优化策略 v2.1.0

apiVersion: apps/v1
kind: Deployment
metadata:
  name: law-oa-backend
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
    version: v2.1.0
    managed-by: kubectl
    environment: production
  annotations:
    description: "Law OA Go Backend Application - Enterprise Deployment"
    deployment.kubernetes.io/revision: "1"
    kubernetes.io/change-cause: "Automated deployment with enhanced security and monitoring"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
    sidecar.istio.io/inject: "false"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%  # 最多25%的Pod不可用
      maxSurge: 25%         # 最多额外25%的Pod
      progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: law-oa
      component: backend
      version: v2.1.0
  template:
    metadata:
      labels:
        app: law-oa
        component: backend
        version: v2.1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # The application does not call the Kubernetes API. Keep the default
      # service-account token out of the pod even if namespace defaults change.
      automountServiceAccountToken: false

      # 初始化容器
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for database to be ready..."
              until nc -z law-oa-postgres-service 5432; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready!"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 50Mi

        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis to be ready..."
              until nc -z law-oa-redis-service 6379; do
                echo "Redis not ready, waiting..."
                sleep 2
              done
              echo "Redis is ready!"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 50Mi

        - name: database-migration
          image: your-registry.com/law-oa/backend:v2.1.0
          command:
            - /app/law-oa-migrate
            - -command
            - bootstrap
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DB_DRIVER
              value: "postgres"
            - name: DB_HOST
              value: "law-oa-postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_SSLMODE
              value: "require"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: db-password
            - name: DB_DATABASE
              value: "law_oa"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      # 主容器
      containers:
        - name: backend
          image: your-registry.com/law-oa/backend:v2.1.0
          imagePullPolicy: IfNotPresent

          # 端口配置
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # 环境变量
          env:
            - name: GIN_MODE
              value: "release"
            - name: ENVIRONMENT
              value: "production"
            - name: TZ
              value: "Asia/Shanghai"
            - name: LOG_LEVEL
              value: "info"
            - name: VERSION
              value: "v2.1.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: DB_DRIVER
              value: "postgres"
            - name: DB_HOST
              value: "law-oa-postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_SSLMODE
              value: "require"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: db-password
            - name: DB_DATABASE
              value: "law_oa"
            - name: REDIS_HOST
              value: "law-oa-redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: redis-password
            - name: ES_HOST
              value: "law-oa-elasticsearch-service.law-oa-logging.svc.cluster.local"
            - name: ES_PORT
              value: "9200"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: jwt-secret
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: app-secret
            - name: SUBJECT_DATA_KEY
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: subject-data-key
            - name: ONLYOFFICE_URL
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: onlyoffice-url
            - name: ONLYOFFICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: onlyoffice-secret
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: law-oa-secrets
                  key: cors-allowed-origins

          # 资源配置
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi

          # 健康检查
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30

          # 安全配置
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001

          # 卷挂载
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
            - name: jwt-secret
              mountPath: /etc/secrets
              readOnly: true

          # The production image is scratch-based and writes structured logs
          # to stdout. Cluster-level log collection should consume container
          # logs; no shell-based sidecar is required here.

      # 卷配置
      volumes:
        - name: config
          configMap:
            name: law-oa-config
            items:
              - key: config.yaml
                path: config.yaml

        - name: jwt-secret
          secret:
            secretName: law-oa-secrets
            items:
              - key: jwt-secret
                path: jwt-secret

        - name: logs
          emptyDir:
            sizeLimit: 1Gi

        - name: uploads
          persistentVolumeClaim:
            claimName: law-oa-uploads-pvc

        - name: tmp
          emptyDir:
            sizeLimit: 100Mi

      # 节点选择
      nodeSelector:
        kubernetes.io/os: linux
        node-type: application

      # 容忍度
      tolerations:
        - key: "application"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      # 亲和性
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - law-oa
                    - key: component
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname

---
# 水平Pod自动缩放
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: law-oa-backend-hpa
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
  annotations:
    description: "Horizontal Pod Autoscaler for Law OA Backend"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: law-oa-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max

---
# Pod中断预算
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: law-oa-backend-pdb
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
  annotations:
    description: "Pod Disruption Budget for Law OA Backend"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: law-oa
      component: backend
