---
# Law OA Go 后端应用部署 - 企业级Kubernetes配置
# 基于最新Kubernetes最佳实践和生产环境优化策略 v2.1.0

apiVersion: apps/v1
kind: Deployment
metadata:
  name: law-oa-backend
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
    version: v2.1.0
    managed-by: kubectl
    environment: production
  annotations:
    description: "Law OA Go Backend Application - Enterprise Deployment"
    deployment.kubernetes.io/revision: "1"
    kubernetes.io/change-cause: "Automated deployment with enhanced security and monitoring"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
    sidecar.istio.io/inject: "false"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%  # 最多25%的Pod不可用
      maxSurge: 25%         # 最多额外25%的Pod
      progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: law-oa
      component: backend
      version: v2.1.0
  template:
    metadata:
      labels:
        app: law-oa
        component: backend
        version: v2.1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      serviceAccountName: law-oa-backend

      # 容器镜像拉取密钥
      imagePullSecrets:
        - name: registry-secret

      # 初始化容器
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for database to be ready..."
              until nc -z mysql-service 3306; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready!"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 50Mi

        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis to be ready..."
              until nc -z redis-service 6379; do
                echo "Redis not ready, waiting..."
                sleep 2
              done
              echo "Redis is ready!"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 50Mi

        - name: database-migration
          image: your-registry.com/law-oa/backend:v2.1.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Running database migrations..."
              ./law-oa-go migrate up
              echo "Migrations completed!"
          envFrom:
            - configMapRef:
                name: law-oa-config
            - secretRef:
                name: law-oa-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      # 主容器
      containers:
        - name: backend
          image: your-registry.com/law-oa/backend:v2.1.0
          imagePullPolicy: IfNotPresent

          # 端口配置
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP

          # 环境变量
          env:
            - name: GIN_MODE
              value: "release"
            - name: ENVIRONMENT
              value: "production"
            - name: TZ
              value: "Asia/Shanghai"
            - name: LOG_LEVEL
              value: "info"
            - name: VERSION
              value: "v2.1.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          envFrom:
            - configMapRef:
                name: law-oa-config
            - secretRef:
                name: law-oa-secrets

          # 资源配置
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi

          # 健康检查
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: health
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30

          # 安全配置
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

          # 卷挂载
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
            - name: jwt-secret
              mountPath: /etc/secrets
              readOnly: true

          # 生命周期钩子
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Received SIGTERM, starting graceful shutdown..."
                    sleep 15

        # 日志收集 sidecar
        - name: log-collector
          image: fluent/fluent-bit:2.2
          imagePullPolicy: IfNotPresent

          env:
            - name: FLUENT_BIT_SERVICE_NAME
              value: "law-oa-backend"
            - name: FLUENT_BIT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FLUENT_BIT_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          volumeMounts:
            - name: logs
              mountPath: /app/logs
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

      # 卷配置
      volumes:
        - name: config
          configMap:
            name: law-oa-config
            items:
              - key: app.yaml
                path: config.yaml

        - name: jwt-secret
          secret:
            secretName: law-oa-secrets
            items:
              - key: jwt-secret
                path: jwt-secret

        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config

        - name: logs
          emptyDir:
            sizeLimit: 1Gi

        - name: uploads
          persistentVolumeClaim:
            claimName: law-oa-uploads-pvc

        - name: tmp
          emptyDir:
            sizeLimit: 100Mi

      # 节点选择
      nodeSelector:
        kubernetes.io/os: linux
        node-type: application

      # 容忍度
      tolerations:
        - key: "application"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      # 亲和性
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - law-oa
                    - key: component
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname

---
# 水平Pod自动缩放
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: law-oa-backend-hpa
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
  annotations:
    description: "Horizontal Pod Autoscaler for Law OA Backend"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: law-oa-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max

---
# Pod中断预算
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: law-oa-backend-pdb
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
  annotations:
    description: "Pod Disruption Budget for Law OA Backend"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: law-oa
      component: backend