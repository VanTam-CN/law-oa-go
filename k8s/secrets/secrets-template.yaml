---
# Law OA Go 密钥配置模板
# 在实际部署前，需要使用 kubectl create secret 或 external-secrets 创建实际的密钥
apiVersion: v1
kind: Secret
metadata:
  name: law-oa-secrets
  namespace: law-oa
  labels:
    app: law-oa
    component: secrets
    version: v2.1.0
  annotations:
    description: "Law OA Go Application Secrets"
type: Opaque
stringData:
  # 生产部署前由 Secret 管理系统填充，仓库不提供可用凭据。
  # 本文件是兼容模板；正式生产入口优先使用 law-oa-secrets.yaml。
  db-user: ""
  db-password: ""
  jwt-secret: ""
  redis-password: ""
  app-secret: ""
  subject-data-key: ""
  onlyoffice-url: ""
  onlyoffice-secret: ""
  cors-allowed-origins: ""
  otel-token: ""
  grafana-admin-password: ""
  # TLS证书 (如果有)
  # tls.crt: "<base64-encoded-certificate>"
  # tls.key: "<base64-encoded-private-key>"

---
# 数据库连接字符串密钥
apiVersion: v1
kind: Secret
metadata:
  name: database-connection
  namespace: law-oa
  labels:
    app: law-oa
    component: database
    version: v2.1.0
  annotations:
    description: "Database Connection String"
type: Opaque
data:
  # 完整连接字符串不作为应用配置入口；使用 DB_* 环境变量和独立密钥。
  connection-string: ""

---
# 外部服务API密钥
apiVersion: v1
kind: Secret
metadata:
  name: external-apis
  namespace: law-oa
  labels:
    app: law-oa
    component: external
    version: v2.1.0
  annotations:
    description: "External API Keys"
type: Opaque
data:
  # 邮件服务配置
  smtp-username: ""
  smtp-password: ""

  # 第三方API密钥
  # ai-service-key: "<base64-encoded-key>"
  # payment-api-key: "<base64-encoded-key>"
  # sms-service-key: "<base64-encoded-key>"
