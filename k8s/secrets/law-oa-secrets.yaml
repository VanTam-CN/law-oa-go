# Law OA Go 生产 Secret 资源模板
#
# 本文件只声明键名，不包含任何可用凭据、证书、私钥或镜像仓库认证信息。
# 正式环境请使用 Secret Manager、External Secrets 或受控的 kubectl secret
# create 命令填充；禁止把真实值提交到 Git。
apiVersion: v1
kind: Secret
metadata:
  name: law-oa-secrets
  namespace: law-oa
  labels:
    app: law-oa
    component: secrets
    environment: production
    project: law-oa-go
type: Opaque
stringData:
  db-user: ""
  db-password: ""
  redis-password: ""
  jwt-secret: ""
  app-secret: ""
  subject-data-key: ""
  onlyoffice-url: ""
  onlyoffice-secret: ""
  cors-allowed-origins: ""

---
# 后端使用的最小权限 ServiceAccount。应用本身不需要读取 Kubernetes API。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: law-oa-backend
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
    environment: production
    project: law-oa-go
automountServiceAccountToken: false

---
# 保留显式的最小 RBAC 资源，供需要集群探针或运维集成的部署方按需启用。
# 默认 ServiceAccount 不自动挂载 token，因此应用容器不会获得这些权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: law-oa-backend-role
  namespace: law-oa
  labels:
    app: law-oa
    component: rbac
    environment: production
    project: law-oa-go
rules: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: law-oa-backend-rolebinding
  namespace: law-oa
  labels:
    app: law-oa
    component: rbac
    environment: production
    project: law-oa-go
subjects:
  - kind: ServiceAccount
    name: law-oa-backend
    namespace: law-oa
roleRef:
  kind: Role
  name: law-oa-backend-role
  apiGroup: rbac.authorization.k8s.io
