---
# Nginx负载均衡服务
apiVersion: v1
kind: Service
metadata:
  name: law-oa-nginx-service
  namespace: law-oa
  labels:
    app: law-oa
    component: nginx
    service-type: loadbalancer
    environment: production
    project: law-oa-go
    managed-by: kubectl
  annotations:
    description: "Law OA Go Nginx负载均衡服务"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012"

spec:
  type: LoadBalancer
  sessionAffinity: None
  externalTrafficPolicy: Local

  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

  - name: https
    port: 443
    targetPort: https
    protocol: TCP

  selector:
    app: law-oa
    component: nginx

---
# 监控端点服务 (用于外部监控)
apiVersion: v1
kind: Service
metadata:
  name: law-oa-metrics-service
  namespace: law-oa
  labels:
    app: law-oa
    component: metrics
    service-type: monitoring
    environment: production
    project: law-oa-go
    managed-by: kubectl
  annotations:
    description: "Law OA Go 应用监控端点服务"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

spec:
  type: NodePort
  sessionAffinity: None
  externalTrafficPolicy: Local

  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    nodePort: 30080
    protocol: TCP

  selector:
    app: law-oa
    component: backend