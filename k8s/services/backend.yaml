# Law OA Go Kubernetes production service contracts.
# PostgreSQL, Redis and Elasticsearch workloads are managed by the platform or
# a separate operator; these Services only provide the names used by the app.

apiVersion: v1
kind: Service
metadata:
  name: law-oa-backend-service
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
    environment: production
    project: law-oa-go
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: law-oa
    component: backend

---
apiVersion: v1
kind: Service
metadata:
  name: law-oa-frontend-service
  namespace: law-oa
  labels:
    app: law-oa
    component: frontend
    environment: production
    project: law-oa-go
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: law-oa
    component: frontend

---
# This Service expects an operator-managed PostgreSQL workload with matching
# labels, or an explicitly managed Endpoints/EndpointSlice.
apiVersion: v1
kind: Service
metadata:
  name: law-oa-postgres-service
  namespace: law-oa
  labels:
    app: law-oa
    component: database
    environment: production
    project: law-oa-go
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app: law-oa
    component: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: law-oa-redis-service
  namespace: law-oa
  labels:
    app: law-oa
    component: cache
    environment: production
    project: law-oa-go
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app: law-oa
    component: redis

---
# Elasticsearch is intentionally kept in its own logging namespace. The
# application only needs the HTTP endpoint; transport and monitoring services
# belong to the Elasticsearch operator deployment.
apiVersion: v1
kind: Service
metadata:
  name: law-oa-elasticsearch-service
  namespace: law-oa-logging
  labels:
    app: law-oa
    component: elasticsearch
    environment: production
    project: law-oa-go
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
  selector:
    app: law-oa
    component: elasticsearch
