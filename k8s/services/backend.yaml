# Law OA Go 后端服务 - Kubernetes Service配置
# 基于最新Kubernetes Service最佳实践

apiVersion: v1
kind: Service
metadata:
  name: law-oa-backend-service
  namespace: law-oa
  labels:
    app: law-oa
    component: backend
    service-type: backend
    environment: production
    project: law-oa-go
    managed-by: kubectl
  annotations:
    description: "Law OA Go 后端API服务"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
    service.beta.kubernetes.io/load-balancer-source-ranges: "0.0.0.0/0"

spec:
  type: ClusterIP
  sessionAffinity: None

  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP

  - name: grpc
    port: 9090
    targetPort: grpc
    protocol: TCP

  - name: metrics
    port: 8081
    targetPort: metrics
    protocol: TCP

  selector:
    app: law-oa
    component: backend

---
# 前端服务
apiVersion: v1
kind: Service
metadata:
  name: law-oa-frontend-service
  namespace: law-oa
  labels:
    app: law-oa
    component: frontend
    service-type: frontend
    environment: production
    project: law-oa-go
    managed-by: kubectl
  annotations:
    description: "Law OA Go 前端应用服务"

spec:
  type: ClusterIP
  sessionAffinity: None

  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

  selector:
    app: law-oa
    component: frontend

---
# 数据库服务
apiVersion: v1
kind: Service
