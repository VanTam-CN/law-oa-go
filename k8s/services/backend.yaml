---
# Jaeger服务
apiVersion: v1
kind: Service
metadata:
  name: law-oa-jaeger-service
  namespace: law-oa-monitoring
  labels:
    app: law-oa
    component: jaeger
    service-type: tracing
    environment: production
    project: law-oa-go
    managed-by: kubectl
  annotations:
    description: "Law OA Go Jaeger分布式追踪服务"

spec:
  type: ClusterIP
  sessionAffinity: None

  ports:
  - name: http-ui
    port: 16686
    targetPort: http-ui
    protocol: TCP

  - name: collector-grpc
    port: 14250
    targetPort: collector-grpc
    protocol: TCP

  - name: collector-http
    port: 14268
    targetPort: collector-http
    protocol: TCP

  - name: agent-compact
    port: 6831
    targetPort: agent-compact
    protocol: UDP

  - name: agent-binary
    port: 6832
    targetPort: agent-binary
    protocol: UDP

  selector:
    app: law-oa
    component: jaeger

---
