---
# Law OA Go 应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: law-oa-config
  namespace: law-oa
  labels:
    app: law-oa
    component: config
    version: v2.1.0
  annotations:
    description: "Law OA Go Application Configuration"
data:
  # 应用配置
  app.yaml: |
    # Law OA Go - Production Configuration
    app:
      name: "law-oa-go"
      version: "2.1.0"
      environment: "production"
      debug: false

    server:
      port: 8080
      read_timeout: "30s"
      write_timeout: "30s"
      idle_timeout: "60s"
      read_header_timeout: "10s"
      max_header_bytes: 1048576

    # 数据库配置
    database:
      host: "mysql-service"
      port: 3306
      user: "lawuser"
      name: "law_oa"
      charset: "utf8mb4"
      parse_time: true
      loc: "Asia/Shanghai"
      max_open_conns: 100
      max_idle_conns: 20
      conn_max_lifetime: "1h"
      conn_max_idle_time: "10m"

    # Redis配置
    redis:
      host: "redis-service"
      port: 6379
      db: 0
      pool_size: 20
      min_idle_conns: 5
      dial_timeout: "5s"
      read_timeout: "3s"
      write_timeout: "3s"
      pool_timeout: "4s"
      idle_timeout: "5m"
      idle_check_frequency: "1m"

    # Elasticsearch配置
    elasticsearch:
      hosts: ["http://elasticsearch-service:9200"]
      username: ""
      password: ""
      max_retries: 3
      retry_backoff: "100ms"
      max_bulk_size: 50
      workers: 4

    # 日志配置
    logging:
      level: "info"
      format: "json"
      output: "stdout"
      enable_caller: true
      enable_stacktrace: false
      sampling_period: "1s"
      initial_cap: 1000
      max_cap: 10000

    # 监控配置
    monitoring:
      prometheus:
        enabled: true
        path: "/metrics"
        port: 9090

      opentelemetry:
        enabled: true
        service_name: "law-oa-go"
        service_version: "2.1.0"
        environment: "production"
        sampling_rate: 0.1
        exporters:
          - type: "otlp"
            endpoint: "http://jaeger-service:4318"
            headers:
              authorization: "Bearer ${OTEL_TOKEN}"

    # 安全配置
    security:
      jwt:
        secret_key: "${JWT_SECRET}"
        expire_hours: 24
        refresh_expire_hours: 168

      cors:
        allowed_origins: ["https://lawoa.com", "https://www.lawoa.com"]
        allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        allowed_headers: ["Origin", "Content-Type", "Authorization"]
        expose_headers: ["Content-Length"]
        allow_credentials: true
        max_age: "12h"

      rate_limit:
        enabled: true
        requests_per_minute: 100
        burst: 20

    # 缓存配置
    cache:
      default_ttl: "5m"
      cleanup_interval: "10m"
      max_size: 10000

    # 文件上传配置
    upload:
      max_file_size: "50MB"
      allowed_types: ["image/jpeg", "image/png", "application/pdf", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
      storage_path: "/app/uploads"

  # Nginx配置
  nginx.conf: |
    upstream backend {
        server backend-service:8080;
        keepalive 32;
    }

    upstream frontend {
        server frontend-service:3003;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    server {
        listen 80;
        server_name lawoa.com www.lawoa.com;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none';" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;

        # API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Login endpoint with stricter rate limiting
        location /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoints
        location /health {
            proxy_pass http://backend;
            access_log off;
        }

        location /metrics {
            proxy_pass http://backend;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # Frontend routes
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Static file serving
        location /uploads/ {
            alias /var/www/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }
    }

  # MySQL配置
  mysql.cnf: |
    [mysqld]
    # Character Set
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci

    # Performance tuning
    innodb_buffer_pool_size=2G
    innodb_log_file_size=256M
    innodb_log_buffer_size=16M
    innodb_flush_log_at_trx_commit=2
    innodb_flush_method=O_DIRECT

    # Connection settings
    max_connections=1000
    max_connect_errors=100000
    wait_timeout=600
    interactive_timeout=600

    # Query cache
    query_cache_type=1
    query_cache_size=64M
    query_cache_limit=2M

    # Slow query log
    slow_query_log=1
    long_query_time=2
    log_queries_not_using_indexes=1

    # Binary log
    log_bin=mysql-bin
    binlog_format=ROW
    expire_logs_days=7
    max_binlog_size=100M

    # Security
    local_infile=0
    skip_show_database=1

    [mysql]
    default-character-set=utf8mb4

    [client]
    default-character-set=utf8mb4

  # Redis配置
  redis.conf: |
    # Memory
    maxmemory 1gb
    maxmemory-policy allkeys-lru

    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec

    # Networking
    timeout 300
    tcp-keepalive 60
    tcp-backlog 511

    # Security
    protected-mode yes

    # Performance
    tcp-nodelay yes
    rdbcompression yes

    # Logging
    loglevel notice