services:
  # 文档服务
  document-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DOC_SERVICE_DATABASE_HOST=mysql
      - DOC_SERVICE_REDIS_HOST=redis
      - DOC_SERVICE_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - DOC_SERVICE_MINIO_ENDPOINT=minio:9000
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
      - elasticsearch
      - minio
    networks:
      - document-service-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: document-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOC_MYSQL_ROOT_PASSWORD:?DOC_MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${DOC_MYSQL_DATABASE:-document_service}
      MYSQL_USER: ${DOC_MYSQL_USER:?DOC_MYSQL_USER must be set}
      MYSQL_PASSWORD: ${DOC_MYSQL_PASSWORD:?DOC_MYSQL_PASSWORD must be set}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - document-service-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: document-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - document-service-network
    command: redis-server --appendonly yes

  # Elasticsearch 搜索引擎
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: document-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - document-service-network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: document-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${DOC_MINIO_ROOT_USER:?DOC_MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${DOC_MINIO_ROOT_PASSWORD:?DOC_MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    networks:
      - document-service-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO 客户端 (用于创建初始bucket)
  minio-setup:
    image: minio/mc:latest
    container_name: document-minio-setup
    depends_on:
      - minio
    environment:
      DOC_MINIO_ROOT_USER: ${DOC_MINIO_ROOT_USER:?DOC_MINIO_ROOT_USER must be set}
      DOC_MINIO_ROOT_PASSWORD: ${DOC_MINIO_ROOT_PASSWORD:?DOC_MINIO_ROOT_PASSWORD must be set}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${DOC_MINIO_ROOT_USER} $${DOC_MINIO_ROOT_PASSWORD} &&
      /usr/bin/mc mb myminio/documents ||
      echo 'Bucket already exists' &&
      /usr/bin/mc anonymous set none myminio/documents &&
      exit 0
      "
    networks:
      - document-service-network

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: document-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - document-service-network

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: document-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${DOC_GRAFANA_ADMIN_PASSWORD:?DOC_GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - document-service-network

volumes:
  mysql_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  document-service-network:
    driver: bridge
