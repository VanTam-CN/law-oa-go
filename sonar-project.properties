# SonarQube 优化配置文件
# Law OA Go 项目代码质量分析 - 优化版本 v1.1

# 项目基本信息
sonar.projectKey=law-oa-go
sonar.projectName=Law OA Go
sonar.projectVersion=2.1.0
sonar.projectDescription=Law Office Automation System built with Go and TypeScript

# 源代码路径
sonar.sources=.
sonar.sourceEncoding=UTF-8

# 排除的目录和文件 - 优化配置
sonar.exclusions=**/*_test.go,**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage.out,**/*.prof,**/migrations/**,**/docs/**,**/scripts/**,**/*.pb.go,**/*.gen.go,**/*mock*.go,**/tmp/**,**/bin/**,**/.git/**,**/reports/**,**/tools/**

# 测试代码路径
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# 测试覆盖率报告路径
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,frontend-vue/coverage/lcov.info

# Go相关配置
sonar.go.tests.reportPaths=tests/test-results.xml

# JavaScript/TypeScript相关配置
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.typescript.file.suffixes=.ts,.tsx

# 前端项目路径
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend-vue/coverage/lcov.info

# 代码质量规则
sonar.issue.ignore.multicriteria=e1,e2,e3

# 排除某些已知问题
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1128
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6957
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.tsx

sonar.issue.ignore.multicriteria.e3.ruleKey=go:S1128
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.go

# 代码异味阈值
sonar.majorSmellThreshold=3
sonar.minorSmellThreshold=5

# 重复代码阈值
sonar.duplications.blockMinSize=10
sonar.duplications.blockMinLines=4

# 复杂度阈值
sonar.squid.complexity.threshold=15
sonar.squid.cognitive.complexity.threshold=20

# 测试覆盖率阈值
sonar.coverage.minimum=70
sonar.coverage.new.minimum=80

# 可维护性评级
sonar.debtRating=A

# 可靠性评级
sonar.reliabilityRating=A

# 安全性评级
sonar.securityRating=A

# 语言设置
sonar.language=go

# 多语言支持
sonar.javascript.libraries=frontend/node_modules,frontend-vue/node_modules

# 排除特定模式
sonar.global.exclusions=**/*_test.go,**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/migrations/**,**/docs/**

# 自定义规则
sonar.cs.ignoredQualityProfiles=Sonar way

# 新增优化配置
# 分析超时设置
sonar.analysis.timeout=300

# 并发分析设置
sonar.analysis.mode=publish

# 新代码定义
sonar.newCode.referenceBranch=main

# 质量门禁配置
sonar.qualitygate.wait=true

# 外部问题导入
sonar.externalIssuesReportPaths=reports/golangci-lint-report.json,reports/eslint-report.json

# 通用问题导入
sonar.genericIssuesReportPaths=reports/generic-issues.json

# 代码重复检测配置
sonar.cpd.go.minimumtokens=50
sonar.cpd.js.minimumtokens=50

# 分支分析配置
sonar.branch.name=${BRANCH_NAME}
sonar.branch.target=main

# Pull Request 分析配置
sonar.pullrequest.key=${PR_NUMBER}
sonar.pullrequest.branch=${PR_BRANCH}
sonar.pullrequest.base=${PR_BASE}

# 安全热点配置
sonar.security.hotspots.inheritFromParent=true

# 问题分配配置
sonar.issues.defaultAssigneeLogin=admin

# 分析日志级别
sonar.log.level=INFO

# 扫描器配置
sonar.scanner.force-deprecated-java-version=false