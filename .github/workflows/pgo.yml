name: PGO优化工作流

# The legacy pipeline was removed because it could not generate a trustworthy
# workload profile: its scripts were removed by 94722d4, their historical
# versions have no func main, and old fallbacks treated errors as completion.
# Restore a real workload before re-enabling this workflow. Benchmark-based
# PGO remains available in ci-cd.yml and the Makefile.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  GO_VERSION: '1.25.0'

jobs:
  legacy-workload-disabled:
    name: Legacy PGO workload disabled
    runs-on: ubuntu-latest
    if: false
    steps:
    - name: Explain disabled workflow
      run: echo "Legacy PGO workload is disabled until a real workload is restored."
