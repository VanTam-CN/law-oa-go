name: PGO优化工作流

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  GO_VERSION: '1.25.0'

jobs:
  check-pgo:
    name: 检查PGO支持
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 检查Go版本和PGO支持
        shell: bash
        run: |
          set -euo pipefail
          go version
          go help build | grep -q -- '-pgo'

  collect-profile:
    name: 真实工作负载与性能数据
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check-pgo
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pgo
          POSTGRES_PASSWORD: pgo-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: law_oa_pgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgo -d law_oa_pgo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DB_DRIVER: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: pgo
      DB_PASSWORD: pgo-${{ github.run_id }}-${{ github.run_attempt }}
      DB_DATABASE: law_oa_pgo
      DB_SSLMODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 8080
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 初始化隔离数据库并准备虚构夹具
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          qa_password="$(openssl rand -base64 24)"
          subject_data_key="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$qa_password"
          echo "::add-mask::$subject_data_key"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "QA_PASSWORD=$qa_password" >> "$GITHUB_ENV"
          echo "QA_FIXTURE_CONFIRM=I_UNDERSTAND" >> "$GITHUB_ENV"
          echo "SUBJECT_DATA_KEY=$subject_data_key" >> "$GITHUB_ENV"

          export JWT_SECRET="$jwt_secret"
          export QA_PASSWORD="$qa_password"
          export QA_FIXTURE_CONFIRM=I_UNDERSTAND
          export SUBJECT_DATA_KEY="$subject_data_key"
          go run ./cmd/migrate -command bootstrap
          go run ./cmd/qa-fixture -mode seed
          go run ./cmd/qa-fixture -mode seed
          go run ./cmd/qa-fixture -mode verify

      - name: 运行根服务真实HTTP工作负载
        shell: bash
        run: |
          set -euo pipefail
          go build -o /tmp/law-oa-server .
          /tmp/law-oa-server > /tmp/law-oa-pgo.log 2>&1 &
          server_pid=$!
          login_response=''
          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            if [[ -n "$login_response" ]]; then
              rm -f "$login_response"
            fi
          }
          trap cleanup EXIT

          live=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health/live > /tmp/pgo-live.json; then
              live=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              sed -n '1,240p' /tmp/law-oa-pgo.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$live" != true ]]; then
            sed -n '1,240p' /tmp/law-oa-pgo.log
            exit 1
          fi
          jq -e '.live == true' /tmp/pgo-live.json
          if ! curl --fail --silent --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8080/health/ready | jq -e '.ready == true'; then
            sed -n '1,240p' /tmp/law-oa-pgo.log
            exit 1
          fi

          login_response="$(mktemp)"
          jq -n --arg email 'qa.lawyer.a@qa.invalid' --arg password "$QA_PASSWORD" \
            '{email: $email, password: $password}' \
            | curl --fail --silent -H 'Content-Type: application/json' --data @- \
                http://127.0.0.1:8080/api/v1/auth/login > "$login_response"
          token="$(jq -er '.data.token // .token' "$login_response")"
          echo "::add-mask::$token"
          rm -f "$login_response"
          login_response=''

          for request in $(seq 1 100); do
            curl --fail --silent http://127.0.0.1:8080/health/live > /dev/null
            curl --fail --silent \
              -H "Authorization: Bearer $token" \
              'http://127.0.0.1:8080/api/v1/dashboard/statistics' > /dev/null
            curl --fail --silent \
              -H "Authorization: Bearer $token" \
              'http://127.0.0.1:8080/api/v1/cases?page=1&page_size=20' > /dev/null
          done

      - name: 生成CPU和内存profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles
          go test ./internal/services \
            -run '^$' \
            -bench '^BenchmarkClientService_CreateClient$' \
            -benchtime=5s \
            -cpuprofile=profiles/cpu.prof \
            -memprofile=profiles/mem.prof
          test -s profiles/cpu.prof
          test -s profiles/mem.prof

      - name: 上传性能数据
        uses: actions/upload-artifact@v4
        with:
          name: profile-data
          path: profiles/
          if-no-files-found: error

  pgo-optimized-build:
    name: PGO优化构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: collect-profile
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 下载性能数据
        uses: actions/download-artifact@v4
        with:
          name: profile-data
          path: profiles/

      - name: 构建并证明PGO profile被消费
        shell: bash
        run: |
          set -euo pipefail
          test -s profiles/cpu.prof
          mkdir -p bin
          if ! go build -a -x -pgo=profiles/cpu.prof -ldflags='-s -w' \
            -o bin/law-oa-server-pgo . 2> /tmp/pgo-build.log; then
            tail -n 240 /tmp/pgo-build.log
            exit 1
          fi
          grep -F -- '-pgoprofile' /tmp/pgo-build.log > /dev/null
          test -s bin/law-oa-server-pgo

          go build -ldflags='-s -w' -o bin/law-oa-server-standard .
          test -s bin/law-oa-server-standard

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pgo-optimized-binaries
          path: bin/
          if-no-files-found: error

  performance-benchmark:
    name: PGO二进制运行验证
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pgo-optimized-build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pgo
          POSTGRES_PASSWORD: pgo-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: law_oa_pgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgo -d law_oa_pgo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DB_DRIVER: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: pgo
      DB_PASSWORD: pgo-${{ github.run_id }}-${{ github.run_attempt }}
      DB_DATABASE: law_oa_pgo
      DB_SSLMODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 8080
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载依赖和构建产物
        run: go mod download

      - name: 下载PGO构建产物
        uses: actions/download-artifact@v4
        with:
          name: pgo-optimized-binaries
          path: bin/

      - name: 准备隔离运行数据
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          qa_password="$(openssl rand -base64 24)"
          subject_data_key="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$qa_password"
          echo "::add-mask::$subject_data_key"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "QA_PASSWORD=$qa_password" >> "$GITHUB_ENV"
          echo "QA_FIXTURE_CONFIRM=I_UNDERSTAND" >> "$GITHUB_ENV"
          echo "SUBJECT_DATA_KEY=$subject_data_key" >> "$GITHUB_ENV"

          export JWT_SECRET="$jwt_secret"
          export QA_PASSWORD="$qa_password"
          export QA_FIXTURE_CONFIRM=I_UNDERSTAND
          export SUBJECT_DATA_KEY="$subject_data_key"
          go run ./cmd/migrate -command bootstrap
          go run ./cmd/qa-fixture -mode seed
          go run ./cmd/qa-fixture -mode seed
          go run ./cmd/qa-fixture -mode verify

      - name: 验证PGO和标准二进制
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/law-oa-server-pgo bin/law-oa-server-standard

          run_and_probe() (
            set -euo pipefail
            local binary="$1"
            local label="$2"
            local log_file="/tmp/${label}.log"
            "$binary" > "$log_file" 2>&1 &
            local server_pid=$!
            cleanup_server() {
              if kill -0 "$server_pid" 2>/dev/null; then
                kill "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
              fi
            }
            trap cleanup_server EXIT

            local live=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:8080/health/live \
                | jq -e '.live == true' > /dev/null; then
                live=true
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                sed -n '1,240p' "$log_file"
                return 1
              fi
              sleep 1
            done
            if [[ "$live" != true ]]; then
              sed -n '1,240p' "$log_file"
              return 1
            fi
            if ! curl --fail --silent --retry 30 --retry-delay 1 --retry-all-errors \
              http://127.0.0.1:8080/health/ready | jq -e '.ready == true' > /dev/null; then
              sed -n '1,240p' "$log_file"
              return 1
            fi
          )

          run_and_probe ./bin/law-oa-server-pgo pgo
          run_and_probe ./bin/law-oa-server-standard standard

      - name: 生成性能比较报告
        shell: bash
        run: |
          set -euo pipefail
          pgo_size="$(stat -c%s bin/law-oa-server-pgo)"
          standard_size="$(stat -c%s bin/law-oa-server-standard)"
          test "$pgo_size" -gt 0
          test "$standard_size" -gt 0
          {
            echo '# PGO优化性能报告'
            echo
            echo "- Go版本: $(go version)"
            echo "- PGO优化版本: $pgo_size bytes"
            echo "- 标准版本: $standard_size bytes"
            echo '- PGO和标准根服务均通过隔离 PostgreSQL/Redis 健康验证。'
          } > pgo-performance-report.md

      - name: 上传性能报告
        uses: actions/upload-artifact@v4
        with:
          name: pgo-performance-report
          path: pgo-performance-report.md
          if-no-files-found: error

  pgo-report:
    name: 生成PGO构建报告
    runs-on: ubuntu-latest
    needs: [collect-profile, pgo-optimized-build, performance-benchmark]
    if: always()
    steps:
      - name: 生成PGO构建摘要
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## PGO优化构建状态'
            echo
            echo '| 阶段 | 状态 |'
            echo '|---|---|'
            echo '| 真实工作负载与性能数据 | ${{ needs.collect-profile.result }} |'
            echo '| PGO优化构建 | ${{ needs.pgo-optimized-build.result }} |'
            echo '| PGO二进制运行验证 | ${{ needs.performance-benchmark.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PGO汇总门禁
        if: >-
          needs.collect-profile.result != 'success' ||
          needs.pgo-optimized-build.result != 'success' ||
          needs.performance-benchmark.result != 'success'
        run: exit 1
