# Law OA Go - 企业级CI/CD流水线
# 基于最新GitHub Actions最佳实践和生产环境优化策略

name: 🚀 CI/CD Pipeline

# 触发条件
on:
  push:
    branches: [ main, develop, release/* ]
    tags: ['v*']
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      deploy_version:
        description: 'Version to deploy'
        required: false
        type: string

# 全局环境变量
env:
  REGISTRY: law-registry.com
  IMAGE_NAME: law-oa-go
  FRONTEND_IMAGE_NAME: law-oa-frontend
  GO_VERSION: '1.25.0'
  NODE_VERSION: '20'
  DOCKER_BUILDKIT: 1
  DOCKER_DRIVER: overlay2
  DOCKER_CLI_EXPERIMENTAL: enabled

# 权限配置
permissions:
  contents: read
  pull-requests: read
  actions: read

# 并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 变量
# 任务矩阵
jobs:
  # ================================
  # 代码质量检查
  # ================================
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐹 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 📦 缓存Go模块
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: 🔍 代码格式检查
        run: |
          go install mvdan.cc/gofumpt@latest
          gofumpt -w -s .
          git diff --exit-code

      - name: 📋 静态分析
        run: |
          go vet ./...
          go mod verify
          if [ -f .golangci.yml ]; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
            golangci-lint run --timeout=5m
          fi

      - name: 🔒 安全扫描
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: 📊 测试覆盖率
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🧪 运行测试
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: 📈 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: -v
          token: ${{ secrets.CODECOV_TOKEN }}

  # ================================
  # 多架构构建
  # ================================
  build:
    name: 🏗️ Multi-Arch Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.image-meta.outputs.tag }}
      image-ref: ${{ steps.image-meta.outputs.ref }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ 设置可部署镜像标识
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          ref="${REGISTRY}/${IMAGE_NAME}:${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: 🔐 登录容器仓库
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 🔧 设置QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 🔧 设置Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure
          driver-opts: |
            image-optimize=true
            network=host

      - name: 🏗️ 构建和推送镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-meta.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_TARGET=standard
            VERSION=${{ github.ref_name }}
          sbom: true
          provenance: true
          outputs: type=image,name=metadata,format=gha-metadata

      - name: 🔍 安全扫描镜像
        uses: aquasecurity/trivy-action@master
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ steps.image-meta.outputs.ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📊 上传安全扫描结果
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ================================
  # 前端构建
  # ================================
  build-frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.image-meta.outputs.tag }}
      image-ref: ${{ steps.image-meta.outputs.ref }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 安装依赖
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 代码质量检查
        working-directory: ./frontend
        run: |
          npm run lint
          npm run test:coverage
          npm run type-check

      - name: 🏗️ 构建生产版本
        working-directory: ./frontend
        run: npm run build

      - name: 🏷️ 设置可部署前端镜像标识
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          ref="${REGISTRY}/${FRONTEND_IMAGE_NAME}:${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: 🔐 登录容器仓库
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 🔧 设置QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 🔧 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ 构建和推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-meta.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            BACKEND_UPSTREAM=law-oa-backend-service:8080
            REACT_APP_API_URL=/api
            REACT_APP_ENVIRONMENT=production
            GENERATE_SOURCEMAP=false
          sbom: true
          provenance: true

      - name: 📦 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 30

      - name: 📊 上传覆盖率报告
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./frontend/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # ================================
  # 部署到Kubernetes (staging)
  # ================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [quality, build, build-frontend]
    permissions:
      contents: read
      deployments: write
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: staging

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: 🔐 配置kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: 🚀 部署应用
        run: |
          set -euo pipefail
          namespace="law-oa-staging"
          image_ref="${{ needs.build.outputs.image-ref }}"
          frontend_image_ref="${{ needs.build-frontend.outputs.image-ref }}"
          workdir="${RUNNER_TEMP}/law-oa-staging-manifests"
          mkdir -p "$workdir"

          kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
          kubectl get secret law-oa-secrets -n "$namespace" >/dev/null

          for key in db-user db-password jwt-secret app-secret subject-data-key cors-allowed-origins; do
            encoded="$(kubectl get secret law-oa-secrets -n "$namespace" -o "jsonpath={.data['${key}']}" 2>/dev/null || true)"
            if [ -z "$encoded" ] || ! printf '%s' "$encoded" | base64 -d 2>/dev/null | grep -q '[^[:space:]]'; then
              echo "Secret law-oa-secrets/$key is missing or empty" >&2
              exit 1
            fi
          done

          for service in law-oa-postgres-service law-oa-redis-service; do
            kubectl get service "$service" -n "$namespace" >/dev/null
            kubectl get endpoints "$service" -n "$namespace" >/dev/null
          done
          render_manifest() {
            local source="$1"
            local target_name="$2"
            local target="$workdir/$target_name"
            sed \
              -e "s/namespace: law-oa$/namespace: ${namespace}/g" \
              -e "s#your-registry.com/law-oa/backend:v2.1.0#${image_ref}#g" \
              -e "s#your-registry.com/law-oa/frontend:v2.1.0#${frontend_image_ref}#g" \
              -e "s#law-oa.svc.cluster.local#${namespace}.svc.cluster.local#g" \
              "$source" > "$target"
          }

          render_manifest k8s/configmaps/law-oa-config.yaml configmaps.yaml
          render_manifest k8s/persistentvolumeclaims/uploads.yaml uploads.yaml
          render_manifest k8s/services/backend.yaml services.yaml
          render_manifest k8s/deployments/backend.yaml deployment.yaml
          render_manifest k8s/deployments/frontend.yaml frontend-deployment.yaml
          kubectl apply -f "$workdir/configmaps.yaml"
          kubectl apply -f "$workdir/uploads.yaml"
          kubectl apply -f "$workdir/services.yaml"
          kubectl apply -f "$workdir/deployment.yaml"
          kubectl apply -f "$workdir/frontend-deployment.yaml"
          kubectl rollout status deployment/law-oa-backend -n "$namespace" --timeout=10m
          kubectl rollout status deployment/law-oa-frontend -n "$namespace" --timeout=10m

      - name: 🔍 健康检查
        run: |
          set -euo pipefail
          namespace="law-oa-staging"
          kubectl wait --for=condition=ready pod -l app=law-oa,component=backend -n "$namespace" --timeout=5m
          kubectl wait --for=condition=ready pod -l app=law-oa,component=frontend -n "$namespace" --timeout=5m
          kubectl get pods -n "$namespace" -l app=law-oa,component=backend
          kubectl get services -n "$namespace"
          kubectl get endpoints law-oa-frontend-service -n "$namespace"
          kubectl get ingress -n "$namespace" || true

      - name: 📊 运行集成测试
        run: |
          # 等待服务启动
          sleep 30

          # Both API readiness and the externally routed frontend are release gates.
          curl -f --silent --show-error https://staging.lawoa.com/health/ready | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'
          frontend_url="${{ vars.STAGING_FRONTEND_URL }}"
          test -n "$frontend_url"
          curl -f --silent --show-error "${frontend_url%/}/health" | grep -q healthy
          curl -f --silent --show-error "${frontend_url%/}/login" | grep -q '<html'

      - name: 📧 收集日志
        if: failure()
        run: |
          kubectl logs -n law-oa-staging -l app=law-oa,component=backend --tail=100 > deployment-logs.txt

      - name: 📧 上传部署日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-logs
          path: deployment-logs.txt

  # ================================
  # 部署到Kubernetes (production)
  # ================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality, build, build-frontend]
    permissions:
      contents: read
      deployments: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: 🔐 配置kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: 🚀 蓝蓝部署
        run: |
          set -euo pipefail
          namespace="law-oa-production"
          image_ref="${{ needs.build.outputs.image-ref }}"
          frontend_image_ref="${{ needs.build-frontend.outputs.image-ref }}"
          workdir="${RUNNER_TEMP}/law-oa-production-manifests"
          mkdir -p "$workdir"

          kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
          kubectl get secret law-oa-secrets -n "$namespace" >/dev/null

          for key in db-user db-password jwt-secret app-secret subject-data-key cors-allowed-origins; do
            encoded="$(kubectl get secret law-oa-secrets -n "$namespace" -o "jsonpath={.data['${key}']}" 2>/dev/null || true)"
            if [ -z "$encoded" ] || ! printf '%s' "$encoded" | base64 -d 2>/dev/null | grep -q '[^[:space:]]'; then
              echo "Secret law-oa-secrets/$key is missing or empty" >&2
              exit 1
            fi
          done

          for service in law-oa-postgres-service law-oa-redis-service; do
            kubectl get service "$service" -n "$namespace" >/dev/null
            kubectl get endpoints "$service" -n "$namespace" >/dev/null
          done
          render_manifest() {
            local source="$1"
            local target_name="$2"
            local target="$workdir/$target_name"
            sed \
              -e "s/namespace: law-oa$/namespace: ${namespace}/g" \
              -e "s#your-registry.com/law-oa/backend:v2.1.0#${image_ref}#g" \
              -e "s#your-registry.com/law-oa/frontend:v2.1.0#${frontend_image_ref}#g" \
              -e "s#law-oa.svc.cluster.local#${namespace}.svc.cluster.local#g" \
              "$source" > "$target"
          }

          render_manifest k8s/configmaps/law-oa-config.yaml configmaps.yaml
          render_manifest k8s/persistentvolumeclaims/uploads.yaml uploads.yaml
          render_manifest k8s/services/backend.yaml services.yaml
          render_manifest k8s/deployments/backend.yaml deployment.yaml
          render_manifest k8s/deployments/frontend.yaml frontend-deployment.yaml
          kubectl apply -f "$workdir/configmaps.yaml"
          kubectl apply -f "$workdir/uploads.yaml"
          kubectl apply -f "$workdir/services.yaml"
          kubectl apply -f "$workdir/deployment.yaml"
          kubectl apply -f "$workdir/frontend-deployment.yaml"
          kubectl rollout status deployment/law-oa-backend -n "$namespace" --timeout=15m
          kubectl rollout status deployment/law-oa-frontend -n "$namespace" --timeout=15m

      - name: 🔍 生产健康检查
        run: |
          # 等待所有Pod就绪
          kubectl wait --for=condition=ready pod -l app=law-oa,component=backend -n law-oa-production --timeout=10m
          kubectl wait --for=condition=ready pod -l app=law-oa,component=frontend -n law-oa-production --timeout=10m

          # 验证服务状态
          kubectl get pods -n law-oa-production -l app=law-oa,component=backend
          kubectl get services -n law-oa-production
          kubectl get endpoints law-oa-frontend-service -n law-oa-production
          kubectl get ingress -n law-oa-production || true

          # 等待DNS传播
          sleep 60

          # /api/health is not a registered route; readiness is the release gate.
          curl -f --silent --show-error https://api.lawoa.com/health/ready | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'
          frontend_url="${{ vars.FRONTEND_URL }}"
          test -n "$frontend_url"
          curl -f --silent --show-error "${frontend_url%/}/health" | grep -q healthy
          curl -f --silent --show-error "${frontend_url%/}/login" | grep -q '<html'

      - name: 🔒 生产环境安全扫描
        run: |
          # 扫描已部署的应用
          trivy image --format table "${{ needs.build.outputs.image-ref }}"
          trivy image --format table "${{ needs.build-frontend.outputs.image-ref }}"

          # 检查Kubernetes安全配置
          kubectl auth can-i --list --as=system:serviceaccount:law-oa-backend -n law-oa-production

      - name: 📊 收集监控指标
        run: |
          # 收集Prometheus指标
          sleep 120

          # 验证监控端点
          curl -f http://prometheus.lawoa.com/api/v1/query?query=up{job="law-oa-go"}
          curl -f https://grafana.lawoa.com/api/health

      - name: 🎯 创建部署标签
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');

            github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `deployment:${tag}`,
              color: '0e8a16',
              description: `部署于生产环境的版本 ${tag}`
            });

      - name: 📧 收集生产日志
        if: failure()
        run: |
          kubectl logs -n law-oa-production -l app=law-oa,component=backend --tail=200 > production-deployment-logs.txt

      - name: 📧 上传生产日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-logs
          path: production-deployment-logs.txt

  # ================================
  # 通知和报告
  # ================================
  notify:
    name: 📢 Notification & Report
    runs-on: ubuntu-latest
    needs: [quality, build, build-frontend, deploy-staging, deploy-production]
    if: always()
    permissions:
      contents: read
      issues: write
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

    steps:
      - name: 🔔 生成部署报告
        run: |
          cat > deployment-report.md << EOF
          # 🚀 Law OA Go 部署报告

          ## 📊 构建信息
          - **提交**: ${{ github.sha }}
          - **分支**: ${{ github.ref_name }}
          - **时间**: ${{ github.event.head_commit.timestamp }}
          - **作者**: ${{ github.actor }}

          ## 🏷️ 构建结果
          - **状态**: ${{ job.status }}
          - **Docker镜像**: ${{ needs.build.outputs.image-tag }}
          - **前端构建**: ${{ needs.build-frontend.result }}

          ## 📋 质量检查
          - **代码质量**: ${{ needs.quality.result }}
          - **测试覆盖率**: 见 coverage artifact

          ## 🚀 部署状态
          - **Staging**: ${{ needs.deploy-staging.result }}
          - **Production**: ${{ needs.deploy-production.result }}

          ## 📈 监控链接
          - **Grafana**: https://grafana.lawoa.com
          - **Prometheus**: https://prometheus.lawoa.com
          - **Jaeger**: https://jaeger.lawoa.com

          EOF

      - name: 📧 上传部署报告
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deployment-report.md

      - name: 💬 Slack通知
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK_URL != ''
        with:
          status: ${{ job.status }}
          text: |
            *Law OA Go CI/CD Pipeline*
            *分支*: ${{ github.ref_name }}
            *提交*: ${{ github.sha }}
            *状态*: ${{ job.status }}
            *构建结果*: ${{ needs.build.result }}
            *质量检查*: ${{ needs.quality.result }}
            *部署状态*: Staging: ${{ needs.deploy-staging.result }}, Production: ${{ needs.deploy-production.result }}

      - name: 📧 发送邮件通知
        uses: dawidd6/action-send-mail@v4
        if: always() && env.EMAIL_USERNAME != '' && env.EMAIL_PASSWORD != '' && env.EMAIL_FROM != '' && env.NOTIFICATION_EMAIL != ''
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ env.EMAIL_FROM }}
          subject: "Law OA Go CI/CD Pipeline Report - ${{ job.status }}"
          body: "file:deployment-report.md"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
