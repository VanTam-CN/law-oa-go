name: np-pr52-e2e-runner-probe

on:
  push:
    branches:
      - codex/np-pr52-e2e-runner
    paths:
      - .github/workflows/np-pr52-e2e-runner-probe.yml

permissions:
  contents: read

env:
  NP_PR52_E2E_RUNNER_FIX: 8a8fb8a9b8857fc87634561def33a6cc0783c9dc
  NP_PR52_E2E_PREV_WRAPPER: 57921906968d51d06a7411c150466649b642d6b8

jobs:
  probe:
    name: chromium launch probe on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify wrapper ancestry and final diff
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$NP_PR52_E2E_PREV_WRAPPER"
          test "$(git rev-parse HEAD^^)" = "$NP_PR52_E2E_RUNNER_FIX"
          test "$(git rev-parse "$NP_PR52_E2E_PREV_WRAPPER"^)" = "$NP_PR52_E2E_RUNNER_FIX"
          test -z "$(git status --porcelain)"
          changed=$(git diff --name-only "$NP_PR52_E2E_RUNNER_FIX" "$GITHUB_SHA")
          test "$changed" = ".github/workflows/np-pr52-e2e-runner-probe.yml"
          echo "WRAPPER_SHA=$GITHUB_SHA"
          echo "PREV_WRAPPER_SHA=$NP_PR52_E2E_PREV_WRAPPER"
          echo "RUNNER_FIX_SHA=$NP_PR52_E2E_RUNNER_FIX"
          git checkout --detach "$NP_PR52_E2E_RUNNER_FIX"
          test "$(git rev-parse HEAD)" = "$NP_PR52_E2E_RUNNER_FIX"
          test -z "$(git status --porcelain)"
          echo "RUN_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright chromium with dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Launch chromium headless and verify locked versions and title
        working-directory: frontend
        run: |
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const lockCore = lock.packages['node_modules/playwright-core'].version;
          const lockPw = lock.packages['node_modules/playwright'].version;
          const installedCore = JSON.parse(fs.readFileSync('node_modules/playwright-core/package.json', 'utf8')).version;
          const installedPw = JSON.parse(fs.readFileSync('node_modules/playwright/package.json', 'utf8')).version;
          if (installedCore !== lockCore) {
            console.error('PLAYWRIGHT_CORE_MISMATCH lock=' + lockCore + ' installed=' + installedCore);
            process.exit(1);
          }
          if (installedPw !== lockPw) {
            console.error('PLAYWRIGHT_MISMATCH lock=' + lockPw + ' installed=' + installedPw);
            process.exit(1);
          }
          console.log('LOCKED_PLAYWRIGHT=' + lockPw);
          console.log('LOCKED_PLAYWRIGHT_CORE=' + lockCore);
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto('data:text/html,<title>np-pr52-e2e-runner-probe</title>');
            const title = await page.title();
            if (title !== 'np-pr52-e2e-runner-probe') {
              console.error('TITLE_MISMATCH ' + title);
              process.exit(1);
            }
            console.log('BROWSER_VERSION ' + browser.version());
            console.log('PROBE_TITLE_OK ' + title);
            await browser.close();
          })().catch((err) => {
            const msg = err && err.message ? err.message : String(err);
            console.error('PROBE_LAUNCH_FAILED ' + msg.split('\n')[0]);
            process.exit(1);
          });
          JS
