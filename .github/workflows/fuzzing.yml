name: Fuzzing测试工作流

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨1点运行Fuzzing测试
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Fuzzing测试类型'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - security
        - validators
        - repositories
        - cache
        - concurrency
      duration:
        description: 'Fuzzing持续时间 (秒)'
        required: false
        default: '60'
        type: string
      fuzzers:
        description: '并行Fuzzing进程数'
        required: false
        default: '4'
        type: string

permissions:
  contents: read

env:
  GO_VERSION: '1.25.0'

jobs:
  # 输入枚举校验与参数白名单，产出可信路由与数值参数
  preflight:
    name: 参数校验
    runs-on: ubuntu-latest
    outputs:
      test_type: ${{ steps.params.outputs.test_type }}
      fuzz_seconds: ${{ steps.params.outputs.fuzz_seconds }}
      fuzzers: ${{ steps.params.outputs.fuzzers }}
    steps:
    - name: 校验并输出参数
      id: params
      env:
        RAW_TEST_TYPE: ${{ github.event.inputs.test_type }}
        RAW_DURATION: ${{ github.event.inputs.duration }}
        RAW_FUZZERS: ${{ github.event.inputs.fuzzers }}
      run: |
        test_type="${RAW_TEST_TYPE:-all}"
        case "$test_type" in
          all|security|validators|repositories|cache|concurrency) ;;
          *) echo "未知 test_type" >&2; exit 1 ;;
        esac
        duration="${RAW_DURATION:-60}"
        fuzzers="${RAW_FUZZERS:-4}"
        [[ "$duration" =~ ^[1-9][0-9]{0,3}$ && "$duration" -le 3600 ]] || { echo 'Invalid duration' >&2; exit 1; }
        [[ "$fuzzers" =~ ^[1-9][0-9]?$ && "$fuzzers" -le 16 ]] || { echo 'Invalid fuzzers' >&2; exit 1; }
        echo "test_type=$test_type" >> "$GITHUB_OUTPUT"
        echo "fuzz_seconds=$duration" >> "$GITHUB_OUTPUT"
        echo "fuzzers=$fuzzers" >> "$GITHUB_OUTPUT"

  # 检查Fuzzing支持
  check-fuzzing:
    name: 检查Fuzzing支持
    needs: preflight
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 设置Go环境
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: 检查Go版本和Fuzzing支持
      run: |
        go version
        go help testflag > "$RUNNER_TEMP/testflags"
        grep -Eq '^[[:space:]]*-fuzz regexp' "$RUNNER_TEMP/testflags"

  # 安全组件Fuzzing（security 包及其 fuzz 目标不依赖 Redis/MySQL，无需服务步骤）
  security-fuzzing:
    name: 安全组件Fuzzing
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    runs-on: ubuntu-latest
    needs: [check-fuzzing, preflight]
    if: needs.preflight.outputs.test_type == 'all' || needs.preflight.outputs.test_type == 'security'
    env:
      FUZZ_SECONDS: ${{ needs.preflight.outputs.fuzz_seconds }}
      FUZZERS: ${{ needs.preflight.outputs.fuzzers }}
    strategy:
      matrix:
        test: ['jwt-validation']
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 设置Go环境
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: 下载依赖
      run: |
        go mod download

    - name: 设置脚本权限
      run: |
        chmod +x scripts/fuzzing_test.sh

    - name: 运行JWT验证Fuzzing
      if: matrix.test == 'jwt-validation'
      run: |
        rc=0
        ./scripts/fuzzing_test.sh -s -t "${FUZZ_SECONDS}s" -f "$FUZZERS" -o "$RUNNER_TEMP/security-fuzzing-results" >"$RUNNER_TEMP/fuzz-run.log" 2>&1 || rc=$?
        tail -80 "$RUNNER_TEMP/fuzz-run.log" || true
        exit $rc

    - name: 归档Fuzz输出与crasher
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-logs-${{ matrix.test }}
        path: |
          ${{ runner.temp }}/fuzz-*.log
          internal/**/testdata/fuzz/
        if-no-files-found: ignore
        retention-days: 7

    - name: 核实目标执行证据
      id: proof
      run: |
        bash scripts/np-ci/check-fuzz-result.sh "$RUNNER_TEMP/security-fuzzing-results" Fuzz_JWTKeyManager_ValidateToken

  # 验证器Fuzzing
  validators-fuzzing:
    name: 验证器Fuzzing
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    runs-on: ubuntu-latest
    needs: [check-fuzzing, preflight]
    if: needs.preflight.outputs.test_type == 'all' || needs.preflight.outputs.test_type == 'validators'
    env:
      FUZZ_SECONDS: ${{ needs.preflight.outputs.fuzz_seconds }}
      FUZZERS: ${{ needs.preflight.outputs.fuzzers }}
    strategy:
      matrix:
        test: ['Fuzz_CaseValidator_Validate', 'Fuzz_ClientValidator_Validate', 'Fuzz_LawyerValidator_Validate']
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 设置Go环境
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: 下载依赖
      run: |
        go mod download

    - name: 设置脚本权限
      run: |
        chmod +x scripts/fuzzing_test.sh

    - name: 运行选定目标
      env:
        TARGET: ${{ matrix.test }}
      run: |
        rc=0
        go test -v -fuzz="^${TARGET}$" -parallel="$FUZZERS" -fuzztime="${FUZZ_SECONDS}s" ./internal/validators/ >"$RUNNER_TEMP/fuzz-$TARGET.log" 2>&1 || rc=$?
        tail -80 "$RUNNER_TEMP/fuzz-$TARGET.log" || true
        exit $rc

    - name: 归档Fuzz输出与crasher
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-logs-${{ matrix.test }}
        path: |
          ${{ runner.temp }}/fuzz-*.log
          internal/**/testdata/fuzz/
        if-no-files-found: ignore
        retention-days: 7

    - name: 核实目标执行证据
      id: proof
      env:
        TARGET: ${{ matrix.test }}
      run: |
        bash scripts/np-ci/check-fuzz-result.sh "$RUNNER_TEMP" "$TARGET"

  # 数据库Fuzzing（编译参与 fuzz 的目标为纯构建占位，包内编译测试用 sqlite :memory:，无需 MySQL 服务）
  repositories-fuzzing:
    name: 数据库Fuzzing
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    runs-on: ubuntu-latest
    needs: [check-fuzzing, preflight]
    if: needs.preflight.outputs.test_type == 'all' || needs.preflight.outputs.test_type == 'repositories'
    env:
      FUZZ_SECONDS: ${{ needs.preflight.outputs.fuzz_seconds }}
      FUZZERS: ${{ needs.preflight.outputs.fuzzers }}
    strategy:
      matrix:
        test: ['Fuzz_QueryBuilder_Where', 'Fuzz_QueryBuilder_Like', 'Fuzz_QueryBuilder_Order']
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 设置Go环境
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: 下载依赖
      run: |
        go mod download

    - name: 设置脚本权限
      run: |
        chmod +x scripts/fuzzing_test.sh

    - name: 运行选定目标
      env:
        TARGET: ${{ matrix.test }}
      run: |
        rc=0
        go test -v -fuzz="^${TARGET}$" -parallel="$FUZZERS" -fuzztime="${FUZZ_SECONDS}s" ./internal/repositories/ >"$RUNNER_TEMP/fuzz-$TARGET.log" 2>&1 || rc=$?
        tail -80 "$RUNNER_TEMP/fuzz-$TARGET.log" || true
        exit $rc

    - name: 归档Fuzz输出与crasher
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-logs-${{ matrix.test }}
        path: |
          ${{ runner.temp }}/fuzz-*.log
          internal/**/testdata/fuzz/
        if-no-files-found: ignore
        retention-days: 7

    - name: 核实目标执行证据
      id: proof
      env:
        TARGET: ${{ matrix.test }}
      run: |
        bash scripts/np-ci/check-fuzz-result.sh "$RUNNER_TEMP" "$TARGET"

  # 缓存Fuzzing（cache 测试直连 127.0.0.1:6379，需安装并启动 Redis；ubuntu-26.04 镜像无 redis-server 服务单元）
  cache-fuzzing:
    name: 缓存Fuzzing
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    runs-on: ubuntu-latest
    needs: [check-fuzzing, preflight]
    if: needs.preflight.outputs.test_type == 'all' || needs.preflight.outputs.test_type == 'cache'
    env:
      FUZZ_SECONDS: ${{ needs.preflight.outputs.fuzz_seconds }}
      FUZZERS: ${{ needs.preflight.outputs.fuzzers }}
    strategy:
      matrix:
        test: ['Fuzz_CacheService_SetAndGet', 'Fuzz_CacheService_SetWithExpiration', 'Fuzz_CacheService_ConcurrentAccess', 'Fuzz_LayeredCache_Get']
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 设置Go环境
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: 下载依赖
      run: |
        go mod download

    - name: 安装并启动Redis
      run: |
        if ! command -v redis-server >/dev/null 2>&1 && ! command -v valkey-server >/dev/null 2>&1; then
          sudo apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server || \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq valkey
        fi
        sudo systemctl start redis-server 2>/dev/null || sudo systemctl start valkey-server 2>/dev/null || \
          sudo redis-server --daemonize yes 2>/dev/null || sudo valkey-server --daemonize yes
        for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null && break; sleep 1; done
        (echo > /dev/tcp/127.0.0.1/6379) || { echo 'Redis 未就绪 (127.0.0.1:6379)' >&2; exit 1; }

    - name: 设置脚本权限
      run: |
        chmod +x scripts/fuzzing_test.sh

    - name: 运行选定目标
      env:
        TARGET: ${{ matrix.test }}
      run: |
        rc=0
        go test -v -fuzz="^${TARGET}$" -parallel="$FUZZERS" -fuzztime="${FUZZ_SECONDS}s" ./internal/cache/ >"$RUNNER_TEMP/fuzz-$TARGET.log" 2>&1 || rc=$?
        tail -80 "$RUNNER_TEMP/fuzz-$TARGET.log" || true
        exit $rc

    - name: 归档Fuzz输出与crasher
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-logs-${{ matrix.test }}
        path: |
          ${{ runner.temp }}/fuzz-*.log
          internal/**/testdata/fuzz/
        if-no-files-found: ignore
        retention-days: 7

    - name: 核实目标执行证据
      id: proof
      env:
        TARGET: ${{ matrix.test }}
      run: |
        bash scripts/np-ci/check-fuzz-result.sh "$RUNNER_TEMP" "$TARGET"

  # 并发Fuzzing
  concurrency-fuzzing:
    name: 并发Fuzzing
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    runs-on: ubuntu-latest
    needs: [check-fuzzing, preflight]
    if: needs.preflight.outputs.test_type == 'all' || needs.preflight.outputs.test_type == 'concurrency'
    env:
      FUZZ_SECONDS: ${{ needs.preflight.outputs.fuzz_seconds }}
      FUZZERS: ${{ needs.preflight.outputs.fuzzers }}
    strategy:
      matrix:
        test: ['Fuzz_WorkerPool_SubmitTask', 'Fuzz_CircuitBreaker_Execute', 'Fuzz_RateLimiter_Allow', 'Fuzz_ConcurrentService_SubmitTask']
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 设置Go环境
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: 下载依赖
      run: |
        go mod download

    - name: 设置脚本权限
      run: |
        chmod +x scripts/fuzzing_test.sh

    - name: 运行选定目标
      env:
        TARGET: ${{ matrix.test }}
      run: |
        rc=0
        go test -v -fuzz="^${TARGET}$" -parallel="$FUZZERS" -fuzztime="${FUZZ_SECONDS}s" ./internal/concurrency/ >"$RUNNER_TEMP/fuzz-$TARGET.log" 2>&1 || rc=$?
        tail -80 "$RUNNER_TEMP/fuzz-$TARGET.log" || true
        exit $rc

    - name: 归档Fuzz输出与crasher
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-logs-${{ matrix.test }}
        path: |
          ${{ runner.temp }}/fuzz-*.log
          internal/**/testdata/fuzz/
        if-no-files-found: ignore
        retention-days: 7

    - name: 核实目标执行证据
      id: proof
      env:
        TARGET: ${{ matrix.test }}
      run: |
        bash scripts/np-ci/check-fuzz-result.sh "$RUNNER_TEMP" "$TARGET"

  # 完整Fuzzing测试（15 目标串行；cache 目标依赖 Redis，其余目标无需外部服务）
  comprehensive-fuzzing:
    name: 完整Fuzzing测试
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    runs-on: ubuntu-latest
    needs: [check-fuzzing, preflight]
    if: needs.preflight.outputs.test_type == 'all'
    env:
      FUZZ_SECONDS: ${{ needs.preflight.outputs.fuzz_seconds }}
      FUZZERS: ${{ needs.preflight.outputs.fuzzers }}
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 设置Go环境
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: 下载依赖
      run: |
        go mod download

    - name: 安装并启动Redis
      run: |
        if ! command -v redis-server >/dev/null 2>&1 && ! command -v valkey-server >/dev/null 2>&1; then
          sudo apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server || \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq valkey
        fi
        sudo systemctl start redis-server 2>/dev/null || sudo systemctl start valkey-server 2>/dev/null || \
          sudo redis-server --daemonize yes 2>/dev/null || sudo valkey-server --daemonize yes
        for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null && break; sleep 1; done
        (echo > /dev/tcp/127.0.0.1/6379) || { echo 'Redis 未就绪 (127.0.0.1:6379)' >&2; exit 1; }

    - name: 设置脚本权限
      run: |
        chmod +x scripts/fuzzing_test.sh

    - name: 运行完整Fuzzing测试
      run: |
        rc=0
        ./scripts/fuzzing_test.sh -a -t "${FUZZ_SECONDS}s" -f "$FUZZERS" -o "$RUNNER_TEMP/comprehensive-fuzzing-results" >"$RUNNER_TEMP/fuzz-run.log" 2>&1 || rc=$?
        tail -80 "$RUNNER_TEMP/fuzz-run.log" || true
        exit $rc

    - name: 归档Fuzz输出与crasher
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-logs-comprehensive
        path: |
          ${{ runner.temp }}/fuzz-*.log
          ${{ runner.temp }}/security-fuzzing-results/
          ${{ runner.temp }}/comprehensive-fuzzing-results/
          internal/**/testdata/fuzz/
        if-no-files-found: ignore
        retention-days: 7

    - name: 核实目标执行证据
      id: proof
      run: |
        bash scripts/np-ci/check-fuzz-result.sh "$RUNNER_TEMP/comprehensive-fuzzing-results" Fuzz_JWTKeyManager_ValidateToken Fuzz_CaseValidator_Validate Fuzz_ClientValidator_Validate Fuzz_LawyerValidator_Validate Fuzz_QueryBuilder_Where Fuzz_QueryBuilder_Like Fuzz_QueryBuilder_Order Fuzz_CacheService_SetAndGet Fuzz_CacheService_SetWithExpiration Fuzz_CacheService_ConcurrentAccess Fuzz_LayeredCache_Get Fuzz_WorkerPool_SubmitTask Fuzz_CircuitBreaker_Execute Fuzz_RateLimiter_Allow Fuzz_ConcurrentService_SubmitTask

  # Fuzzing测试汇总报告
  fuzzing-summary:
    name: Fuzzing测试汇总报告
    runs-on: ubuntu-latest
    needs: [preflight, check-fuzzing, security-fuzzing, validators-fuzzing, repositories-fuzzing, cache-fuzzing, concurrency-fuzzing, comprehensive-fuzzing]
    if: always()
    steps:
    - name: 按选中类型核对job 完成状态
      env:
        TEST_TYPE: ${{ needs.preflight.outputs.test_type }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -e --arg selected "$TEST_TYPE" '
          .preflight.result == "success" and .["check-fuzzing"].result == "success" and
          all(to_entries[] | select(.key | endswith("-fuzzing") and . != "check-fuzzing");
            if $selected == "all" or .key == ($selected + "-fuzzing") then
              .value.result == "success" and .value.outputs.verified == "true"
            else .value.result == "skipped" end)
        ' <<< "$RESULTS" > /dev/null
        echo "Verified selected fuzz jobs: $TEST_TYPE" >> "$GITHUB_STEP_SUMMARY"
