name: 安全测试工作流

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每天凌晨3点运行扩展安全检查；扩展检查只出报告，不阻塞默认贡献流。
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_heavy_tests:
        description: '运行历史 fuzz/race 扩展安全测试'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  GO_VERSION: '1.25.0'

jobs:
  security-smoke:
    name: 安全组件冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载并校验依赖
        run: |
          go mod download
          go mod verify

      - name: 运行稳定安全测试
        run: |
          go test -v ./internal/security ./internal/middleware ./internal/repositories ./internal/concurrency

  dependency-scan:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载并校验依赖
        run: |
          go mod download
          go mod verify

      - name: 运行govulncheck并生成报告
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          govulncheck ./... > govulncheck.txt 2>&1
          GOVULN_EXIT=$?
          set -e

          {
            echo "# 安全扫描报告"
            echo ""
            echo "- 扫描时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- govulncheck 退出码: ${GOVULN_EXIT}"
            echo ""
            echo "## Govulncheck 输出"
            echo '```text'
            cat govulncheck.txt
            echo '```'
            echo ""
            echo "> 说明：开源 MVP 阶段依赖扫描以报告形式输出，不阻塞 PR。确认高危可利用漏洞后再提升为阻塞门禁。"
          } > security-report.md

      - name: 上传安全扫描报告
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: security-report.md

  extended-security-tests:
    name: 扩展安全测试
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_heavy_tests == 'true')
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载并校验依赖
        run: |
          go mod download
          go mod verify

      - name: 设置可选服务
        run: |
          sudo systemctl start redis-server || sudo service redis-server start || true
          sudo systemctl start mysql || sudo service mysql start || true
          mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS law_oa_test;" || true

      - name: 运行历史扩展安全测试并生成报告
        run: |
          mkdir -p security-results

          run_check() {
            local name="$1"
            shift
            echo "## ${name}" >> security-results/extended-security-report.md
            echo '```text' >> security-results/extended-security-report.md
            "$@" >> security-results/extended-security-report.md 2>&1 || true
            echo '```' >> security-results/extended-security-report.md
            echo "" >> security-results/extended-security-report.md
          }

          {
            echo "# 扩展安全测试报告"
            echo ""
            echo "- 生成时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 说明：本报告覆盖历史 fuzz/race/缓存/验证器专项，当前不作为 MVP 默认阻塞门禁。"
            echo ""
          } > security-results/extended-security-report.md

          run_check "安全包 race 测试" go test -v -race ./internal/security/...
          run_check "中间件 race 测试" go test -v -race ./internal/middleware/...
          run_check "JWT fuzz 测试" go test -fuzz=Fuzz_JWTKeyManager_ValidateToken -fuzztime=30s ./internal/security/
          run_check "输入验证 fuzz 测试" go test -fuzz=Fuzz_CaseValidator_Validate -fuzztime=15s ./internal/validators/
          run_check "数据库 fuzz 测试" go test -fuzz=Fuzz_QueryBuilder_Where -fuzztime=15s ./internal/repositories/
          run_check "缓存 fuzz 测试" go test -fuzz=Fuzz_CacheService_SetAndGet -fuzztime=15s ./internal/cache/
          run_check "并发 fuzz 测试" go test -fuzz=Fuzz_WorkerPool_SubmitTask -fuzztime=15s ./internal/concurrency/

      - name: 上传扩展安全测试报告
        uses: actions/upload-artifact@v4
        with:
          name: extended-security-report
          path: security-results/extended-security-report.md

  security-report:
    name: 生成安全测试报告
    runs-on: ubuntu-latest
    needs: [security-smoke, dependency-scan, extended-security-tests]
    if: always()
    steps:
      - name: 下载安全测试产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: 生成综合安全报告
        run: |
          {
            echo "# 安全测试综合报告"
            echo ""
            echo "- 生成时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 安全组件冒烟测试: ${{ needs.security-smoke.result }}"
            echo "- 依赖安全扫描: ${{ needs.dependency-scan.result }}"
            echo "- 扩展安全测试: ${{ needs.extended-security-tests.result }}"
            echo ""
            echo "## 结论"
            echo ""
            if [ "${{ needs.security-smoke.result }}" = "success" ]; then
              echo "✅ 默认阻塞安全检查通过。"
            else
              echo "❌ 默认阻塞安全检查失败，请优先查看 security-smoke 日志。"
            fi
            echo ""
            echo "依赖扫描和扩展安全测试的详细输出见本次 workflow artifacts。"
          } > comprehensive-security-report.md

      - name: 上传综合安全报告
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-security-report
          path: comprehensive-security-report.md

      - name: 默认安全门禁
        if: needs.security-smoke.result != 'success'
        run: |
          echo "默认阻塞安全检查未通过。"
          exit 1
