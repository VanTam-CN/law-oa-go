# Law OA Go - 测试流水线
# 完整的测试套件：Go测试、前端测试、E2E测试

name: 🧪 Test Pipeline

on:
  push:
    branches: [ main, develop, codex/np-main-m2, codex/np-main-i11 ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      np_m2_probe:
        description: 'M2 PG validation (negative runs intentionally red jobs on the M2 branch)'
        type: choice
        options: [normal, negative]
        default: normal

env:
  GO_VERSION: '1.25.0'
  NODE_VERSION: '20'

jobs:
  np-i11:
    if: (github.ref == 'refs/heads/codex/np-main-i11' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.head_ref == 'codex/np-main-i11' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        probe: ${{ fromJSON(inputs.np_m2_probe == 'negative' && '["missing-pg","missing-dsn","skip","partial","none","fuzz-unknown","fuzz-selected-failed","fuzz-missing-proof"]' || '["full"]') }}
    env:
      PROBE: ${{ matrix.probe }}
      NP_TEST_DSN: host=127.0.0.1 port=18790 dbname=np_first_slice_dev user=np_m1 sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkout and probe input
        env:
          REQUESTED: ${{ inputs.np_m2_probe }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          case "$REQUESTED" in ''|normal|negative) ;; *) exit 2 ;; esac
          echo "I11_EVENT $GITHUB_EVENT_NAME checkout=$GITHUB_SHA"
          echo "I11_REFS head=$HEAD_SHA base=$BASE_SHA"
      - uses: actions/setup-go@v5
        if: "!startsWith(matrix.probe, 'fuzz-')"
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        if: matrix.probe == 'full'
        with:
          node-version: '22.17.0'
      - name: Install locked dependencies and verify runner tools
        if: matrix.probe == 'full'
        working-directory: frontend
        run: |
          npm ci --replace-registry-host=always --registry=https://registry.npmjs.org --no-audit --no-fund
          google-chrome --version
          psql --version
          docker version --format '{{.Server.Version}}'
      - name: Run isolated PostgreSQL gate
        if: "!startsWith(matrix.probe, 'fuzz-')"
        run: bash scripts/np-ci/early-pg.sh "$PROBE"
      - name: Run registered fuzz gate with controlled input
        if: startsWith(matrix.probe, 'fuzz-')
        run: bash scripts/np-ci/i11-fuzz-probe.sh "$PROBE"

  np-m2-early:
    if: github.ref == 'refs/heads/codex/np-main-m2' || (github.head_ref == 'codex/np-main-m2' || github.head_ref == 'codex/np-main-m3')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        probe: ${{ fromJSON(inputs.np_m2_probe == 'negative' && '["missing-pg","missing-dsn","skip","partial","none"]' || '["normal"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build root application
        if: matrix.probe == 'normal'
        run: go build ./...
      - name: Verify mandatory PostgreSQL test events
        env:
          PROBE: ${{ matrix.probe }}
          NP_TEST_DSN: host=127.0.0.1 port=18790 dbname=np_first_slice_dev user=np_m1 sslmode=disable
        run: bash scripts/np-ci/early-pg.sh "$PROBE"

  # ================================
  # Go 后端测试
  # ================================
  go-tests:
    if: github.ref != 'refs/heads/codex/np-main-m2' && github.ref != 'refs/heads/codex/np-main-i11'
    name: 🐹 Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: law_oa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐹 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository)) }}

      - name: 📦 缓存Go模块
        if: (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: 📥 安装依赖
        run: go mod download

      - name: 🔍 代码检查
        continue-on-error: true
        run: |
          go vet ./... || true
          go fmt ./...

      - name: 🧪 运行单元测试
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: law_oa_test
          REDIS_ADDR: localhost:6379
        run: |
          go test -v -race -coverprofile=coverage-unit.out -covermode=atomic ./internal/...

      - name: 🧪 运行集成测试
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: law_oa_test
          REDIS_ADDR: localhost:6379
        run: |
          go test -v -race -coverprofile=coverage-integration.out -covermode=atomic -tags=integration ./...

      - name: 📊 合并覆盖率报告
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge coverage-unit.out coverage-integration.out > coverage.out

      - name: Record pilot Go coverage
        if: (github.head_ref == 'codex/np-main-m2' || github.head_ref == 'codex/np-main-m3' || (github.head_ref == 'codex/np-main-i11' && github.event.pull_request.head.repo.full_name == github.repository))
        run: |
          go tool cover -func=coverage.out | awk '$1 == "total:" && $3 ~ /^[0-9]+([.][0-9]+)?%$/ { print "Go coverage", $3; found=1 } END { exit !found }' >> "$GITHUB_STEP_SUMMARY"

      - name: 📈 上传覆盖率到Codecov
        if: (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: backend
          name: go-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📋 生成测试报告
        if: always()
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go test -v ./... 2>&1 | go-junit-report -set-exit-code > report.xml

      - name: 📊 上传测试报告
        uses: actions/upload-artifact@v4
        if: always() && (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
        with:
          name: go-test-report
          path: report.xml

  # ================================
  # 前端单元测试
  # ================================
  frontend-tests:
    if: github.ref != 'refs/heads/codex/np-main-m2' && github.ref != 'refs/heads/codex/np-main-i11'
    name: 🎨 Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        continue-on-error: true

      - name: 📥 安装依赖
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 类型检查
        working-directory: ./frontend
        continue-on-error: true
        run: npm run type-check || true

      - name: 🔍 代码检查
        working-directory: ./frontend
        continue-on-error: true
        run: npm run lint || true

      - name: 🧪 运行单元测试
        working-directory: ./frontend
        run: npm run test:ci -- --coverage --coverageReporters=lcov --coverageReporters=text

      - name: Record pilot frontend coverage
        if: (github.head_ref == 'codex/np-main-m2' || github.head_ref == 'codex/np-main-m3' || (github.head_ref == 'codex/np-main-i11' && github.event.pull_request.head.repo.full_name == github.repository))
        run: |
          awk -F: '$1 == "LF" { lines += $2 } $1 == "LH" { hit += $2 } END { if (!lines || hit > lines) exit 1; printf "Frontend line coverage %.1f%%\n", 100 * hit / lines }' frontend/coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: 📈 上传覆盖率到Codecov
        if: (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📊 上传测试报告
        uses: actions/upload-artifact@v4
        if: always() && (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
        with:
          name: frontend-test-report
          path: frontend/coverage/

  # ================================
  # E2E 测试
  # ================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go-tests, frontend-tests]
    if: always() && github.ref != 'refs/heads/codex/np-main-m2' && github.ref != 'refs/heads/codex/np-main-i11'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: law_oa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        continue-on-error: true

      - name: 🐹 设置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository)) }}

      - name: 📥 安装前端依赖
        working-directory: ./frontend
        run: npm ci

      - name: 🎭 安装Playwright浏览器
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: 🏗️ 构建前端
        working-directory: ./frontend
        run: npm run build

      - name: 🚀 启动后端服务
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: law_oa_test
          PORT: 8080
        run: |
          go build -o server ./cmd/server
          ./server &
          sleep 5
          curl -f http://localhost:8080/health || echo "Server starting..."

      - name: 🚀 启动前端服务
        working-directory: ./frontend
        run: |
          npm run preview &
          sleep 5

      - name: 🧪 运行E2E测试
        working-directory: ./frontend
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:4173

      - name: 📊 上传Playwright报告
        uses: actions/upload-artifact@v4
        if: always() && (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: 📸 上传测试截图
        uses: actions/upload-artifact@v4
        if: failure() && (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7

  # ================================
  # 测试覆盖率检查
  # ================================
  coverage-check:
    if: github.ref != 'refs/heads/codex/np-main-i11' && (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
    name: 📊 Coverage Check
    runs-on: ubuntu-latest
    needs: [go-tests, frontend-tests]

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📥 下载Go覆盖率
        uses: actions/download-artifact@v4
        with:
          name: go-test-report
          path: coverage/go
        continue-on-error: true

      - name: 📥 下载前端覆盖率
        uses: actions/download-artifact@v4
        with:
          name: frontend-test-report
          path: coverage/frontend
        continue-on-error: true

      - name: 📊 检查覆盖率阈值
        run: |
          echo "## 📊 测试覆盖率报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 模块 | 覆盖率 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go 后端 | 查看报告 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端 | 查看报告 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E | 运行中 | ✅ |" >> $GITHUB_STEP_SUMMARY

  # ================================
  # 测试结果汇总
  # ================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [go-tests, frontend-tests, e2e-tests]
    if: always() && github.ref != 'refs/heads/codex/np-main-m2' && github.ref != 'refs/heads/codex/np-main-i11'

    steps:
      - name: 📋 生成测试汇总
        run: |
          echo "## 🧪 测试执行汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 测试类型 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go 单元测试 | ${{ needs.go-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端单元测试 | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E 测试 | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ 所有测试已完成" >> $GITHUB_STEP_SUMMARY

      - name: 💬 PR评论
        if: github.event_name == 'pull_request' && (github.head_ref != 'codex/np-main-m2' && github.head_ref != 'codex/np-main-m3' && (github.head_ref != 'codex/np-main-i11' || github.event.pull_request.head.repo.full_name != github.repository))
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.go-tests.result }}' === 'success' &&
                          '${{ needs.frontend-tests.result }}' === 'success' &&
                          '${{ needs.e2e-tests.result }}' === 'success'
                          ? '✅ 所有测试通过'
                          : '❌ 部分测试失败';

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧪 测试结果\n\n${status}\n\n- Go测试: ${{ needs.go-tests.result }}\n- 前端测试: ${{ needs.frontend-tests.result }}\n- E2E测试: ${{ needs.e2e-tests.result }}`
            });
