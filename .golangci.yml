# GolangCI-Lint 优化配置文件
# Law OA Go 项目静态分析配置 - 优化版本 v1.1

run:
  # 超时时间 - 增加以支持更全面的分析
  timeout: 10m
  # 并发数 - 根据 CPU 核心数自动调整
  concurrency: 0
  # 跳过的目录
  skip-dirs:
    - vendor
    - tmp
    - bin
    - docs
    - migrations
    - node_modules
    - dist
    - build
    - .git
  # 跳过的文件
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"
    - ".*mock.*\\.go$"
  # Go版本
  go: "1.23"
  # 构建标签
  build-tags:
    - integration
    - e2e

# 输出配置
output:
  # 输出格式: colored-line-number|line-number|json|tab|checkstyle|code-climate
  format: colored-line-number
  # 打印行号
  print-issued-lines: true
  # 打印检查器名称
  print-linter-name: true
  # 去重
  uniq-by-line: true

# 问题配置
issues:
  # 排除默认的排除规则
  exclude-use-default: false
  # 最大问题数量，0表示无限制
  max-issues-per-linter: 0
  max-same-issues: 0
  # 新代码检查
  new: false
  # 排除规则
  exclude-rules:
    # 排除测试文件的某些检查
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen
    # 排除main.go的某些检查
    - path: main\.go
      linters:
        - gochecknoinits
    # 排除配置文件的某些检查
    - path: config/
      linters:
        - gochecknoglobals

# 启用的检查器 - 优化配置
linters:
  # 禁用所有默认检查器
  disable-all: true
  # 启用的检查器 - 按优先级和影响分组
  enable:
    # 🔴 关键检查器 - 必须通过
    - errcheck      # 检查未处理的错误
    - govet         # Go官方检查器
    - ineffassign   # 检查无效赋值
    - typecheck     # 类型检查
    - staticcheck   # 静态分析检查
    - unused        # 未使用代码检查
    - gosimple      # 简化代码建议
    
    # 🟡 重要检查器 - 代码质量
    - gofmt         # 格式化检查
    - goimports     # import排序检查
    - gci           # import分组检查
    - misspell      # 拼写检查
    - whitespace    # 空白字符检查
    - gocyclo       # 圈复杂度检查
    - funlen        # 函数长度检查
    - gocognit      # 认知复杂度检查
    - nestif        # 嵌套if检查
    
    # 🔒 安全检查器
    - gosec         # 安全检查
    - bodyclose     # HTTP响应体关闭检查
    - sqlclosecheck # SQL连接关闭检查
    - rowserrcheck  # SQL rows.Err检查
    - noctx         # HTTP请求context检查
    
    # ⚡ 性能检查器
    - prealloc      # 预分配检查
    - makezero      # make零值检查
    - sloglint      # 结构化日志检查
    
    # 📝 代码风格和最佳实践
    - goconst       # 常量检查
    - gocritic      # 代码评审检查
    - revive        # 代码风格检查
    - stylecheck    # 样式检查
    - unconvert     # 不必要的类型转换
    - unparam       # 未使用的参数
    - dupl          # 重复代码检查
    
    # 🔧 错误处理增强
    - errorlint     # 错误处理检查
    - errname       # 错误命名检查
    - wrapcheck     # 错误包装检查
    - errchkjson    # JSON错误检查
    
    # 🧹 代码清理
    - asciicheck    # ASCII字符检查
    - bidichk       # Unicode双向字符检查
    - containedctx  # context包含检查
    - contextcheck  # context使用检查
    - decorder      # 声明顺序检查
    - exportloopref # 循环变量导出检查
    - forcetypeassert # 强制类型断言检查
    - goheader      # 文件头检查
    - gomnd         # 魔法数字检查
    - gomoddirectives # go.mod指令检查
    - gomodguard    # go.mod依赖检查
    - importas      # import别名检查
    - loggercheck   # 日志器检查
    - maintidx      # 维护性指数检查
    - nakedret      # 裸返回检查
    - nilnil        # nil比较检查
    - nolintlint    # nolint注释检查
    - nonamedreturns # 命名返回检查
    - predeclared   # 预声明标识符检查
    - promlinter    # Prometheus指标检查
    - reassign      # 重新赋值检查
    - tenv          # 测试环境检查
    - testableexamples # 可测试示例检查
    - tparallel     # 并行测试检查
    - usestdlibvars # 标准库变量使用检查
    - wastedassign  # 浪费赋值检查

# 检查器配置
linters-settings:
  # 错误检查配置
  errcheck:
    # 检查类型断言
    check-type-assertions: true
    # 检查空白标识符
    check-blank: true
    # 排除的函数
    exclude-functions:
      - io/ioutil.ReadFile
      - io.Copy(*bytes.Buffer)
      - io.Copy(os.Stdout)

  # 圈复杂度配置
  gocyclo:
    # 最小复杂度
    min-complexity: 15

  # 函数长度配置
  funlen:
    # 最大行数
    lines: 80
    # 最大语句数
    statements: 50

  # 认知复杂度配置
  gocognit:
    # 最小复杂度
    min-complexity: 20

  # 嵌套if配置
  nestif:
    # 最小复杂度
    min-complexity: 5

  # 重复代码配置
  dupl:
    # 最小重复行数
    threshold: 100

  # 安全检查配置
  gosec:
    # 排除的规则
    excludes:
      - G204  # 子进程启动
      - G304  # 文件路径
    # 配置
    config:
      G301: "0644"
      G302: "0644"
      G306: "0644"

  # 常量检查配置
  goconst:
    # 最小长度
    min-len: 3
    # 最小出现次数
    min-occurrences: 3
    # 忽略测试文件
    ignore-tests: true

  # 代码评审配置
  gocritic:
    # 启用的检查
    enabled-checks:
      - appendAssign
      - assignOp
      - badCall
      - badCond
      - captLocal
      - caseOrder
      - defaultCaseOrder
      - dupArg
      - dupBranchBody
      - dupCase
      - dupSubExpr
      - elseif
      - emptyFallthrough
      - flagDeref
      - ifElseChain
      - regexpMust
      - singleCaseSwitch
      - sloppyLen
      - switchTrue
      - typeSwitchVar
      - underef
      - unlambda
      - unslice
      - valSwap
      - wrapperFunc

  # revive配置
  revive:
    # 规则
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  # 样式检查配置
  stylecheck:
    # 检查
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

  # import检查配置
  gci:
    # 本地模块前缀
    local-prefixes: github.com/your-org/law-oa-go

  # 拼写检查配置
  misspell:
    # 语言
    locale: US
    # 忽略的单词
    ignore-words:
      - colour
      - centre
      - licence

  # 预分配检查配置
  prealloc:
    # 简单模式
    simple: true
    # 范围循环
    range-loops: true
    # for循环
    for-loops: false

  # 错误包装检查配置
  wrapcheck:
    # 忽略的包
    ignorePkgs:
      - github.com/pkg/errors
    # 忽略的接口
    ignoreTypes:
      - .+Error
      - error
    # 忽略的签名
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(

  # 新增配置项
  # 魔法数字检查配置
  gomnd:
    # 忽略的数字
    ignored-numbers:
      - '0'
      - '1'
      - '2'
      - '3'
      - '10'
      - '100'
      - '1000'
    # 忽略的函数
    ignored-functions:
      - 'math.*'
      - 'http.StatusText'
      - 'make'
    # 检查的设置
    settings:
      mnd:
        checks:
          - argument
          - case
          - condition
          - operation
          - return
          - assign

  # 文件头检查配置
  goheader:
    values:
      const:
        COMPANY: Law OA Go Project
        LICENSE: MIT
    template: |-
      Copyright (c) {{ YEAR }} {{ COMPANY }}
      Licensed under {{ LICENSE }}

  # 导入别名检查配置
  importas:
    no-unaliased: true
    alias:
      - pkg: github.com/gin-gonic/gin
        alias: gin
      - pkg: github.com/golang-jwt/jwt/v5
        alias: jwt
      - pkg: gorm.io/gorm
        alias: gorm

  # 维护性指数配置
  maintidx:
    under: 20

  # 裸返回检查配置
  nakedret:
    max-func-lines: 30

  # nolint注释检查配置
  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true

  # 并行测试检查配置
  tparallel:
    ignoreMissing: false

  # 测试环境检查配置
  tenv:
    all: true

# 严重性配置
severity:
  # 默认严重性
  default-severity: error
  # 规则严重性
  rules:
    - linters:
        - dupl
      severity: info
    - linters:
        - goconst
      severity: info