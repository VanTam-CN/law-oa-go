version: '3.8'

services:
  # Go 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: law-oa-app
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=law_oa
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - ES_HOST=http://elasticsearch:9200
      - JWT_SECRET=your-secret-key-change-in-production
    depends_on:
      - mysql
      - redis
      - elasticsearch
    networks:
      - law-oa-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: law-oa-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=law_oa
      - MYSQL_USER=lawuser
      - MYSQL_PASSWORD=lawpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - law-oa-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: law-oa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - law-oa-network
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.8.0
    container_name: law-oa-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - law-oa-network
    restart: unless-stopped

  # Kibana (可选，用于 Elasticsearch 管理)
  kibana:
    image: kibana:8.8.0
    container_name: law-oa-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - law-oa-network
    restart: unless-stopped

  # Nginx (可选，用于反向代理)
  nginx:
    image: nginx:alpine
    container_name: law-oa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - law-oa-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  law-oa-network:
    driver: bridge