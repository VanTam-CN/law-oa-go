# 现代化 Docker Compose 配置 - Law OA Go 系统
# 使用最新 Docker Compose 语法和最佳实践

services:
  # Go 应用后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production  # 使用生产阶段构建
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        # Compose does not evaluate shell command substitutions in .env-style
        # interpolation. CI should provide BUILD_DATE; local builds use a
        # stable marker instead of embedding the literal "$(date ...)".
        BUILD_DATE: ${BUILD_DATE:-local}
        BUILD_TARGET: ${BUILD_TARGET:-standard}
        PGO_PROFILE: ${PGO_PROFILE:-default.pgo}
      cache_from:
        - law-oa-go:latest
      labels:
        - "com.lawoa.build.target=production"
    image: law-oa-go:${IMAGE_TAG:-latest}
    container_name: law-oa-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # 运行环境配置
      - GIN_MODE=${GIN_MODE:-release}
      - TZ=Asia/Shanghai
      # This file is the production Compose entrypoint. Development uses the
      # local Go/Vite commands and must not silently relax production gates.
      - ENVIRONMENT=production
      - PORT=8080
      # Compose uses readiness as the dependency gate, so the frontend is not
      # advertised before the production conflict prerequisites are complete.
      - HEALTHCHECK_PATH=/health/ready

      # 数据库配置
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_SSLMODE=${DB_SSLMODE:-require}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_DATABASE=${DB_DATABASE:-law_oa}

      # Redis is opt-in. The default stack does not advertise a cache server;
      # compose enables this address only with the cache profile.
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0

      # 安全配置
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - APP_SECRET=${APP_SECRET:?APP_SECRET must be set}
      # 主体身份标识加密密钥；生产启动门禁会校验其为32字节密钥
      - SUBJECT_DATA_KEY=${SUBJECT_DATA_KEY:?SUBJECT_DATA_KEY must be set}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      - ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED:-false}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - ONLYOFFICE_SECRET=${ONLYOFFICE_SECRET:-}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}

      # 监控和追踪配置
      - METRICS_ENABLED=${METRICS_ENABLED:-true}

    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - law-oa-network
    volumes:
      # 配置和数据持久化
      - ./config:/app/config:ro  # 只读挂载配置
      - uploads_data:/app/uploads  # 上传文件持久化
      - logs_data:/app/logs       # 日志持久化

    # 健康检查配置
    healthcheck:
      test: ["CMD", "/app/law-oa-go", "healthcheck"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s

    # 重启策略
    restart: unless-stopped

    # 安全配置
    security_opt:
      - no-new-privileges:true
    read_only: ${READ_ONLY:-false}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

    # 标签
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.lawoa.localhost`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "com.lawoa.service.type=backend"
      - "com.lawoa.version=${IMAGE_TAG:-latest}"

  # 生产启动前只执行一次 PostgreSQL schema bootstrap；backend 只有在
  # bootstrap 成功后才会启动。该服务不会写入演示账号或业务种子数据。
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-local}
        BUILD_TARGET: standard
    image: law-oa-go:${IMAGE_TAG:-latest}
    container_name: law-oa-migrate
    entrypoint: ["/app/law-oa-migrate"]
    command: ["-command", "bootstrap"]
    environment:
      - ENVIRONMENT=production
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_SSLMODE=${DB_SSLMODE:-require}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_DATABASE=${DB_DATABASE:-law_oa}
      - DB_LOC=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - law-oa-network
    restart: "no"

  # React 前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      cache_from:
        - law-oa-frontend:latest
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-/api}
        - REACT_APP_ENVIRONMENT=production
        - VITE_ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED:-false}
        - VITE_ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
    image: law-oa-frontend:${IMAGE_TAG:-latest}
    container_name: law-oa-frontend
    ports:
      - "${FRONTEND_PORT:-3003}:80"
    environment:
      - TZ=Asia/Shanghai
      - REACT_APP_API_URL=${REACT_APP_API_URL:-/api}
      - REACT_APP_ENVIRONMENT=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - law-oa-network
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      timeout: 10s
      retries: 3
      interval: 30s
      start_period: 30s

    # 安全配置
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # 标签
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`lawoa.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "com.lawoa.service.type=frontend"
      - "com.lawoa.version=${IMAGE_TAG:-latest}"

  # PostgreSQL 是当前生产 MVP 的唯一受支持数据库方言。历史 MySQL
  # 迁移目录保留在仓库中，但不作为生产安装入口。
  postgres:
    image: postgres:16-alpine
    container_name: law-oa-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE:-law_oa}
      - POSTGRES_USER=${DB_USERNAME:?DB_USERNAME must be set}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - law-oa-network

    # 健康检查配置
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 10s
      retries: 12
      interval: 30s
      start_period: 30s

    # 重启策略
    restart: unless-stopped

    # 安全配置
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 标签
    labels:
      - "com.lawoa.service.type=database"
      - "com.lawoa.database.type=postgresql"

  # Redis 缓存服务
  redis:
    profiles: [cache]
    image: redis:7-alpine
    container_name: law-oa-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - TZ=Asia/Shanghai
      # Keep the cache off general networks; require authentication when the
      # cache profile is enabled in a shared or production-like environment.
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - law-oa-network

    # 健康检查配置
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 10s

    # 重启策略
    restart: unless-stopped

    # Redis 配置命令
    command: ["sh", "-c", "test -n \"$${REDIS_PASSWORD}\" || { echo 'REDIS_PASSWORD must be set for the cache profile' >&2; exit 1; }; exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]

    # 安全配置
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # 标签
    labels:
      - "com.lawoa.service.type=cache"
      - "com.lawoa.cache.type=redis"

  # Jaeger 分布式追踪
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: law-oa-jaeger
    profiles: [observability]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # Jaeger UI
      - "${JAEGER_COLLECTOR_PORT:-14268}:14268"  # HTTP collector
      - "${JAEGER_AGENT_PORT:-6831}:6831/udp"   # UDP agent
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - TZ=Asia/Shanghai
    networks:
      - law-oa-network

    # 健康检查配置
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      timeout: 5s
      retries: 5
      interval: 30s
      start_period: 30s

    # 重启策略
    restart: unless-stopped

    # 安全配置
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # 标签
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.lawoa.localhost`)"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
      - "com.lawoa.service.type=tracing"
      - "com.lawoa.tracing.type=jaeger"

  # Prometheus 监控系统
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: law-oa-prometheus
    profiles: [observability]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - law-oa-network

    # 健康检查配置
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      timeout: 5s
      retries: 5
      interval: 30s
      start_period: 30s

    # 重启策略
    restart: unless-stopped

    # 安全配置
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    # 标签
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.lawoa.localhost`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "com.lawoa.service.type=monitoring"
      - "com.lawoa.monitoring.type=prometheus"

  # Grafana 可视化平台
  grafana:
    image: grafana/grafana:10.2.0
    container_name: law-oa-grafana
    profiles: [observability]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - TZ=Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - law-oa-network

    # 健康检查配置
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$GRAFANA_ADMIN_PASSWORD\" && wget --spider -q http://localhost:3000/api/health"]
      timeout: 5s
      retries: 5
      interval: 30s
      start_period: 60s

    # 重启策略
    restart: unless-stopped

    # 安全配置
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # 标签
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.lawoa.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "com.lawoa.service.type=visualization"
      - "com.lawoa.visualization.type=grafana"

# 网络配置
networks:
  law-oa-network:
    name: law-oa-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

# 数据持久化卷
volumes:
  postgres_data:
    name: law-oa-postgres-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/postgres

  redis_data:
    name: law-oa-redis-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/redis

  prometheus_data:
    name: law-oa-prometheus-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/prometheus

  grafana_data:
    name: law-oa-grafana-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/grafana

  uploads_data:
    name: law-oa-uploads-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/uploads

  logs_data:
    name: law-oa-logs-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/logs
