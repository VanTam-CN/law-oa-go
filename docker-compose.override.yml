# Docker Compose 开发环境覆盖配置
# 此文件会自动覆盖 docker-compose.yml 中的配置，用于开发环境

services:
  # 后端开发配置
  backend:
    build:
      target: development  # 使用开发阶段构建
    volumes:
      # 开发环境代码挂载 (支持热重载)
      - ./internal:/app/internal:delegated
      - ./cmd:/app/cmd:delegated
      - ./pkg:/app/pkg:delegated
      - ./go.mod:/app/go.mod:ro
      - ./go.sum:/app/go.sum:ro
      - ./config:/app/config:delegated  # 开发环境允许修改配置
      - ./logs:/app/logs:delegated
      - ./uploads:/app/uploads:delegated

      # Air 配置文件
      - ./.air.toml:/app/.air.toml:ro

    environment:
      - GIN_MODE=debug
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=debug

      # 开发环境数据库配置
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=lawuser
      - DB_PASSWORD=lawpass
      - DB_NAME=law_oa_dev

      # 开发环境Redis配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=1

      # 开发环境安全配置 (使用弱密钥，仅限开发)
      - JWT_SECRET=dev-secret-key-not-for-production
      - APP_SECRET=dev-app-secret-not-for-production

      # 开发环境监控配置
      - METRICS_ENABLED=true
      - TRACING_ENABLED=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - PROFILING_ENABLED=true

    # 开发环境安全配置 (更宽松)
    security_opt: []  # 移除安全限制以便调试
    read_only: false
    cap_drop: []
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE  # 允许调试

    # 开发环境资源限制 (更宽松)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

    # 开发环境启动命令 (使用Air热重载)
    command: ["air", "-c", ".air.toml"]

    # 开发环境健康检查 (更频繁)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      timeout: 5s
      retries: 3
      interval: 15s
      start_period: 30s

    # 开发环境标签
    labels:
      - "com.lawoa.environment=development"
      - "com.lawoa.hotreload.enabled=true"

  # 前端开发配置
  frontend:
    build:
      target: development  # 使用开发阶段构建
      args:
        - REACT_APP_API_URL=http://localhost:8080
        - REACT_APP_ENVIRONMENT=development
        - REACT_APP_DEBUG=true

    volumes:
      # 开发环境前端代码挂载
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/package-lock.json:/app/package-lock.json:ro

    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_ENVIRONMENT=development
      - REACT_APP_DEBUG=true
      - CHOKIDAR_USEPOLLING=true  # 解决文件监听问题
      - FAST_REFRESH=true
      - GENERATE_SOURCEMAP=true

    ports:
      - "3003:3000"  # 开发环境使用React开发服务器端口

    # 开发环境启动命令 (使用React开发服务器)
    command: ["npm", "start"]

    # 开发环境健康检查 (更频繁)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      timeout: 5s
      retries: 3
      interval: 15s
      start_period: 60s

    # 开发环境安全配置 (更宽松)
    security_opt: []
    read_only: false
    cap_drop: []

    # 开发环境资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

    # 开发环境标签
    labels:
      - "com.lawoa.environment=development"
      - "com.lawoa.hotreload.enabled=true"

  # MySQL 开发配置
  mysql:
    environment:
      - MYSQL_ROOT_PASSWORD=devroot2024
      - MYSQL_DATABASE=law_oa_dev
      - MYSQL_USER=lawuser
      - MYSQL_PASSWORD=lawpass

    # 开发环境MySQL配置 (更宽松)
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --max-connections=100
      --query-cache-size=16M
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=5
      --general-log=1
      --general-log-file=/var/log/mysql/general.log

    # 开发环境资源限制
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

    # 开发环境标签
    labels:
      - "com.lawoa.environment=development"

  # Redis 开发配置
  redis:
    # 开发环境Redis配置 (启用持久化)
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000

    # 开发环境资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

    # 开发环境标签
    labels:
      - "com.lawoa.environment=development"

  # Elasticsearch 开发配置
  elasticsearch:
    environment:
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m -Dlog4j2.formatMsgNoLookups=true"
      - logger.level=DEBUG

    # 开发环境资源限制 (更小)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # 开发环境标签
    labels:
      - "com.lawoa.environment=development"

  # Kibana 开发配置
  kibana:
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=law-oa-kibana-dev
      - SERVER_HOST=0.0.0.0
      - TZ=Asia/Shanghai
      - XPACK_SECURITY_ENABLED=false
      - LOGGING_VERBOSE=true

    # 开发环境资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # 开发环境标签
    labels:
      - "com.lawoa.environment=development"

  # 开发环境额外服务
  # 数据库管理工具
  adminer:
    image: adminer:4.8.1
    container_name: law-oa-adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    networks:
      - law-oa-network
    restart: unless-stopped
    labels:
      - "com.lawoa.service.type=admin"
      - "com.lawoa.environment=development"

  # Redis 管理工具
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: law-oa-redis-commander
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - law-oa-network
    restart: unless-stopped
    depends_on:
      - redis
    labels:
      - "com.lawoa.service.type=admin"
      - "com.lawoa.environment=development"

  # 开发环境网络配置
networks:
  law-oa-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16  # 使用不同的子网避免冲突
          gateway: 172.21.0.1