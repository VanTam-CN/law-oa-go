# Law OA Go 开发环境配置文件
environment: development
port: 8080

database:
  driver: postgres
  host: localhost
  port: 5432
  username: law_oa_user
  password: law_oa_password
  database: law_oa_db
  sslmode: disable
  charset: utf8
  parseTime: true
  loc: UTC

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

elasticsearch:
  host: localhost
  port: 9200
  username: ""
  password: ""

jwt:
  secret: law-oa-dev-secret-key
  expiresIn: 3600
  refreshIn: 7200

log:
  level: debug
  format: text
  output: stdout

cors:
  allowedOrigins:
    - "http://localhost:3003"
    - "http://localhost:3000"
  allowedMethods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowedHeaders:
    - "Content-Type"
    - "Authorization"
    - "X-Request-ID"
  maxAge: "86400"