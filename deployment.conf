# Law OA Go 部署配置文件
# 用于蓝绿部署脚本

# 部署目录配置
declare -A DEPLOYMENT_DIR=(
    ["staging"]="/opt/law-oa-go/staging"
    ["production"]="/opt/law-oa-go/production"
)

# 健康检查URL配置
declare -A HEALTH_CHECK_URLS=(
    ["staging"]="http://localhost:8080/health"
    ["production"]="http://localhost:8080/health"
)

# 回滚功能配置
declare -A ROLLBACK_ENABLED=(
    ["staging"]="true"
    ["production"]="true"
)

# 环境变量配置
declare -A ENV_VARS=(
    ["staging"]=""
    ["production"]=""
)

# 资源限制配置
declare -A RESOURCE_LIMITS=(
    ["staging"]="cpus=1.0,memory=1G"
    ["production"]="cpus=2.0,memory=2G"
)

# 监控配置
declare -A MONITORING_CONFIG=(
    ["staging"]="prometheus_enabled=false,grafana_enabled=false"
    ["production"]="prometheus_enabled=true,grafana_enabled=true"
)

# 数据库配置
declare -A DATABASE_CONFIG=(
    ["staging"]="host=localhost,port=5432,user=<from-secret-manager>,password=<from-secret-manager>,dbname=law_oa_staging"
    ["production"]="host=<managed-postgres>,port=5432,user=<from-secret-manager>,password=<from-secret-manager>,dbname=law_oa_production"
)

# Redis配置
declare -A REDIS_CONFIG=(
    ["staging"]="host=localhost,port=6379,password=<from-secret-manager>,db=0"
    ["production"]="host=<managed-redis>,port=6379,password=<from-secret-manager>,db=0"
)

# 安全配置
declare -A SECURITY_CONFIG=(
    ["staging"]="jwt_secret=<from-secret-manager>,rate_limit=1000"
    ["production"]="jwt_secret=<from-secret-manager>,rate_limit=500"
)

# 日志配置
declare -A LOGGING_CONFIG=(
    ["staging"]="level=info,output=file"
    ["production"]="level=warn,output=file+syslog"
)

# 通知配置
declare -A NOTIFICATION_CONFIG=(
    ["staging"]="slack_enabled=false,email_enabled=false"
    ["production"]="slack_enabled=true,email_enabled=true"
)

# 备份配置
declare -A BACKUP_CONFIG=(
    ["staging"]="enabled=false,retention=7"
    ["production"]="enabled=true,retention=30"
)
