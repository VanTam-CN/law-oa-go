version: '3.8'

services:
  # PostgreSQL 数据库
  postgresql:
    image: postgres:15-alpine
    container_name: law-oa-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: law_oa_db
      POSTGRES_USER: law_oa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-law_oa_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/init-supabase-extensions.sql:/docker-entrypoint-initdb.d/02-extensions.sql
    networks:
      - law-oa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law_oa_user -d law_oa_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Elasticsearch 搜索引擎
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: law-oa-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=law-oa-node
      - cluster.name=law-oa-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    networks:
      - law-oa-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana (可选，用于Elasticsearch管理界面)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: law-oa-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: false
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - law-oa-network
    profiles:
      - tools

  # Redis 缓存 (继续使用现有配置)
  redis:
    image: redis:7-alpine
    container_name: law-oa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - law-oa-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 数据库迁移工具 (按需启动)
  migration:
    image: migrate/migrate
    container_name: law-oa-migration
    volumes:
      - ./migrations:/migrations
    command: ["migrate", "-path", "/migrations", "-database", "postgres://law_oa_user:${POSTGRES_PASSWORD:-law_oa_password}@postgresql:5432/law_oa_db?sslmode=disable", "up"]
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - law-oa-network
    profiles:
      - migration

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local

networks:
  law-oa-network:
    driver: bridge