version: '3.8'

# Law OA Go 代码审查工具链 Docker Compose 配置
# 包含 SonarQube、静态分析工具、监控面板等

# 网络配置
networks:
  code-review-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16

services:
  # SonarQube Community Edition
  sonarqube:
    image: sonarqube:community
    container_name: law-oa-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9092:9092"
    environment:
      # 基本配置
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_WEB_JAVAADDITIONALOPTS=-server
      - SONAR_CE_JAVAADDITIONALOPTS=-server
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-server

      # 性能优化
      - SONAR_WEB_JAVAOPTS=-Xmx1G -Xms1G
      - SONAR_CE_JAVAOPTS=-Xmx1G -Xms512m
      - SONAR_SEARCH_JAVAOPTS=-Xmx1G -Xms512m

      # 数据库配置
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar

      # 安全配置
      - SONAR_FORCEAUTHENTICATION=true
      - SONAR_WEB_CONTEXT=/

      # 日志配置
      - SONAR_LOG_LEVEL=INFO
      - SONAR_LOG_CONSOLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_conf:/opt/sonarqube/conf
    networks:
      - code-review-network
    depends_on:
      sonarqube-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # PostgreSQL 数据库 for SonarQube
  sonarqube-db:
    image: postgres:15-alpine
    container_name: law-oa-sonarqube-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
      - ./scripts/sonar-postgres.conf:/etc/postgresql/postgresql.conf
    networks:
      - code-review-network
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 代码审查工具服务 (包含所有静态分析工具)
  code-review-tools:
    build:
      context: .
      dockerfile: Dockerfile.code-review
    container_name: law-oa-code-review-tools
    restart: unless-stopped
    volumes:
      - .:/workspace
      - ./reports:/workspace/reports
      - ./cache:/workspace/cache
    working_dir: /workspace
    environment:
      - GOPROXY=https://goproxy.io,direct
      - GOSUMDB=off
      - CGO_ENABLED=0
      - GOOS=linux
      - GOARCH=amd64
    networks:
      - code-review-network
    command: ["tail", "-f", "/dev/null"]
    profiles:
      - tools

  # 前端代码审查服务
  frontend-review-tools:
    build:
      context: .
      dockerfile: Dockerfile.frontend-review
    container_name: law-oa-frontend-review-tools
    restart: unless-stopped
    volumes:
      - ./frontend:/workspace/frontend
      - ./frontend-vue:/workspace/frontend-vue
      - ./reports:/workspace/reports
    working_dir: /workspace
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
    networks:
      - code-review-network
    command: ["tail", "-f", "/dev/null"]
    profiles:
      - frontend-tools

  # 监控面板服务 (基于 Grafana)
  monitoring-dashboard:
    image: grafana/grafana:latest
    container_name: law-oa-monitoring-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./scripts/grafana-provisioning:/etc/grafana/provisioning
    networks:
      - code-review-network
    profiles:
      - monitoring

  # 代码质量报告 Web 服务
  quality-report-web:
    build:
      context: .
      dockerfile: Dockerfile.quality-report
    container_name: law-oa-quality-report-web
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./reports:/app/reports
      - ./scripts:/app/scripts
    environment:
      - REPORTS_DIR=/app/reports
      - NODE_ENV=production
    networks:
      - code-review-network
    depends_on:
      - sonarqube
    profiles:
      - reports

  # Nginx 反向代理 (统一入口)
  code-review-nginx:
    image: nginx:alpine
    container_name: law-oa-code-review-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
      - "8443:443"
    volumes:
      - ./scripts/code-review-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./scripts/ssl:/etc/nginx/ssl
      - ./reports:/usr/share/nginx/html/reports
    networks:
      - code-review-network
    depends_on:
      - sonarqube
      - monitoring-dashboard
      - quality-report-web
    profiles:
      - proxy

  # 数据库迁移服务 (可选)
  db-migration:
    build:
      context: .
      dockerfile: Dockerfile.migration
    container_name: law-oa-db-migration
    volumes:
      - ./migrations:/migrations
      - ./scripts:/scripts
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=law_oa
    networks:
      code-review-network:
        aliases:
          - db-migration
    profiles:
      - migration

volumes:
  sonarqube_data:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_conf:
    driver: local
  sonarqube_db_data:
    driver: local
  grafana_data:
    driver: local

networks:
  code-review-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16