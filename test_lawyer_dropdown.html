<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>律师下拉框测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .loading { color: #666; }
        .error { color: red; }
        .success { color: green; }
        .info { background: #f0f0f0; padding: 10px; border-radius: 4px; margin: 10px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>律师下拉框数据源测试</h1>

        <div class="info">
            <h3>测试目的</h3>
            <p>验证新增案件中主办律师下拉框的数据获取功能</p>
        </div>

        <div class="form-group">
            <label for="token">认证Token:</label>
            <input type="text" id="token" style="width: 100%; padding: 8px;" placeholder="请输入JWT token">
        </div>

        <button onclick="testLawyerAPI()">测试律师API</button>

        <div class="form-group" style="margin-top: 20px;">
            <label for="lawyerSelect">主办律师:</label>
            <select id="lawyerSelect">
                <option value="">请先获取律师数据...</option>
            </select>
        </div>

        <div id="result"></div>
    </div>

    <script>
        let authToken = '';
        let lawyerData = [];

        // 页面加载时自动获取token
        window.onload = async function() {
            try {
                const response = await fetch('http://localhost:8080/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@lawoa.com',
                        password: 'admin123'
                    })
                });

                const data = await response.json();
                if (data.success && data.data.token) {
                    authToken = data.data.token;
                    document.getElementById('token').value = authToken;
                    document.getElementById('result').innerHTML = '<div class="success">✅ 自动获取token成功</div>';

                    // 自动获取律师数据
                    testLawyerAPI();
                } else {
                    document.getElementById('result').innerHTML = '<div class="error">❌ 自动获取token失败</div>';
                }
            } catch (error) {
                document.getElementById('result').innerHTML = '<div class="error">❌ 登录失败: ' + error.message + '</div>';
            }
        };

        async function testLawyerAPI() {
            const token = document.getElementById('token').value || authToken;
            if (!token) {
                document.getElementById('result').innerHTML = '<div class="error">❌ 请先输入认证Token</div>';
                return;
            }

            const resultDiv = document.getElementById('result');
            const lawyerSelect = document.getElementById('lawyerSelect');

            try {
                resultDiv.innerHTML = '<div class="loading">🔄 正在获取律师数据...</div>';
                lawyerSelect.innerHTML = '<option value="">正在加载...</option>';

                const response = await fetch('http://localhost:8080/api/v1/lawfirm/lawyers?page=1&page_size=9999', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success && data.data) {
                    lawyerData = data.data;

                    // 模拟前端数据处理逻辑
                    const formattedLawyers = lawyerData.map(lawyer => ({
                        id: lawyer.id.toString(),
                        name: lawyer.name,
                        level: 'SENIOR',
                        specialties: ['法律咨询'],
                        email: lawyer.email || '',
                        phone: lawyer.phone || ''
                    }));

                    // 填充下拉框
                    lawyerSelect.innerHTML = '<option value="">请选择主办律师</option>';
                    formattedLawyers.forEach(lawyer => {
                        const option = document.createElement('option');
                        option.value = lawyer.id;
                        option.textContent = `${lawyer.name} - ${lawyer.email}`;
                        lawyerSelect.appendChild(option);
                    });

                    resultDiv.innerHTML = `
                        <div class="success">
                            ✅ 律师数据获取成功！<br>
                            数据数量: ${formattedLawyers.length}<br>
                            API格式: 统一响应格式 success=true<br>
                            数据来源: MySQL users表 (role=lawyer, status=active)<br><br>
                            <strong>律师列表:</strong><br>
                            ${formattedLawyers.map(l => `• ${l.name} (${l.email})`).join('<br>')}
                        </div>
                    `;

                } else {
                    resultDiv.innerHTML = `<div class="error">❌ API返回错误: ${JSON.stringify(data)}</div>`;
                }

            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ 请求失败: ${error.message}</div>`;
            }
        }

        // 监听下拉框变化
        document.getElementById('lawyerSelect').addEventListener('change', function(e) {
            const selectedLawyer = lawyerData.find(l => l.id.toString() === e.target.value);
            if (selectedLawyer) {
                document.getElementById('result').innerHTML += `
                    <div class="info" style="margin-top: 10px;">
                        <strong>已选择律师:</strong><br>
                        姓名: ${selectedLawyer.name}<br>
                        邮箱: ${selectedLawyer.email}<br>
                        电话: ${selectedLawyer.phone}<br>
                        角色: ${selectedLawyer.role}<br>
                        状态: ${selectedLawyer.status}<br>
                        ID: ${selectedLawyer.id}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
