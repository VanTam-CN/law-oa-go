<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具箱功能测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }
        .test-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: inline-block;
            width: 120px;
            margin-right: 10px;
        }
        .input-group input, .input-group select {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }
        .btn {
            padding: 8px 16px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .success {
            color: #52c41a;
        }
        .error {
            color: #ff4d4f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>工具箱功能测试</h1>
        
        <div class="test-section">
            <div class="test-title">1. 诉讼费计算器</div>
            <div class="input-group">
                <label>标的额：</label>
                <input type="number" id="litigationAmount" placeholder="请输入标的额" value="100000">
            </div>
            <button class="btn btn-primary" onclick="testLitigationFee()">计算诉讼费</button>
            <div id="litigationResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">2. 利息计算器</div>
            <div class="input-group">
                <label>本金：</label>
                <input type="number" id="principal" placeholder="请输入本金" value="100000">
            </div>
            <div class="input-group">
                <label>年利率(%)：</label>
                <input type="number" id="rate" placeholder="请输入年利率" value="4.35" step="0.01">
            </div>
            <div class="input-group">
                <label>天数：</label>
                <input type="number" id="days" placeholder="请输入天数" value="365">
            </div>
            <div class="input-group">
                <label>计算方式：</label>
                <select id="interestType">
                    <option value="simple">单利</option>
                    <option value="compound">复利</option>
                    <option value="penalty">违约金</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="testInterestCalculator()">计算利息</button>
            <div id="interestResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">3. 法条查询</div>
            <div class="input-group">
                <label>类别：</label>
                <select id="lawCategory">
                    <option value="">全部</option>
                    <option value="民事">民事</option>
                    <option value="刑事">刑事</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="testLawSearch()">查询法条</button>
            <div id="lawResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">4. 合同模板</div>
            <button class="btn btn-primary" onclick="testContractTemplates()">获取模板列表</button>
            <div id="contractResult" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8082';
        
        async function apiCall(url, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${url}`, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                const data = await response.json();
                return { success: true, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        function displayResult(elementId, result) {
            const element = document.getElementById(elementId);
            if (result.success) {
                element.innerHTML = `<span class="success">✓ 成功</span>\n${JSON.stringify(result.data, null, 2)}`;
                element.className = 'result success';
            } else {
                element.innerHTML = `<span class="error">✗ 失败</span>\n${result.error}`;
                element.className = 'result error';
            }
        }
        
        async function testLitigationFee() {
            const amount = document.getElementById('litigationAmount').value;
            const result = await apiCall('/tools/litigation-fee', {
                method: 'POST',
                body: JSON.stringify({ amount: Number(amount) })
            });
            displayResult('litigationResult', result);
        }
        
        async function testInterestCalculator() {
            const params = {
                principal: Number(document.getElementById('principal').value),
                rate: Number(document.getElementById('rate').value),
                days: Number(document.getElementById('days').value),
                type: document.getElementById('interestType').value
            };
            const result = await apiCall('/tools/interest-calculator', {
                method: 'POST',
                body: JSON.stringify(params)
            });
            displayResult('interestResult', result);
        }
        
        async function testLawSearch() {
            const category = document.getElementById('lawCategory').value;
            const url = category ? `/tools/laws?category=${category}` : '/tools/laws';
            const result = await apiCall(url, { method: 'GET' });
            displayResult('lawResult', result);
        }
        
        async function testContractTemplates() {
            const result = await apiCall('/tools/contract-templates', { method: 'GET' });
            displayResult('contractResult', result);
        }
    </script>
</body>
</html>
