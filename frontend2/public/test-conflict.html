<!DOCTYPE html>
<html>
<head>
    <title>利益冲突检查测试</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; }
        input, select, textarea { 
            padding: 8px; 
            width: 300px; 
            border: 1px solid #ccc; 
            border-radius: 4px;
        }
        textarea { height: 80px; resize: vertical; }
        button { 
            padding: 10px 20px; 
            background: #1890ff; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover { background: #40a9ff; }
        .result { 
            margin-top: 20px; 
            padding: 15px; 
            border: 1px solid #ccc; 
            border-radius: 4px;
        }
        .success { background: #f6ffed; border-color: #b7eb8f; }
        .warning { background: #fffbe6; border-color: #ffe58f; }
        .error { background: #fff2f0; border-color: #ffccc7; }
        .conflict-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px;
        }
        .conflict-table th, .conflict-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .conflict-table th { background: #f5f5f5; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 12px;
            font-weight: bold;
        }
        .tag-low { background: #fff7e6; color: #fa8c16; }
        .tag-medium { background: #fff1f0; color: #f5222d; }
        .tag-high { background: #fff1f0; color: #cf1322; }
    </style>
</head>
<body>
    <h1>利益冲突检查功能测试</h1>
    
    <form id="conflictForm">
        <div class="form-group">
            <label for="projectName">项目名称：</label>
            <input type="text" id="projectName" required>
        </div>
        
        <div class="form-group">
            <label for="clientName">客户名称：</label>
            <input type="text" id="clientName" required>
        </div>
        
        <div class="form-group">
            <label for="oppositeParties">对方当事人：</label>
            <input type="text" id="oppositeParties" required>
        </div>
        
        <div class="form-group">
            <label for="projectType">项目类型：</label>
            <select id="projectType" required>
                <option value="">请选择</option>
                <option value="CIVIL">民事诉讼</option>
                <option value="COMMERCIAL">商业诉讼</option>
                <option value="CRIMINAL">刑事诉讼</option>
                <option value="ADVISORY">法律顾问</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="teamMembers">团队成员：</label>
            <select id="teamMembers" multiple required>
                <option value="1">管理员</option>
                <option value="2">张律师</option>
                <option value="3">李律师</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="description">项目描述：</label>
            <textarea id="description"></textarea>
        </div>
        
        <button type="submit">检查冲突</button>
        <button type="button" onclick="loadTestData()">加载测试数据</button>
    </form>
    
    <div id="result" style="display: none;"></div>

    <script>
        document.getElementById('conflictForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                project_name: document.getElementById('projectName').value,
                client_name: document.getElementById('clientName').value,
                opposite_parties: document.getElementById('oppositeParties').value,
                project_type: document.getElementById('projectType').value,
                team_members: Array.from(document.getElementById('teamMembers').selectedOptions).map(opt => opt.value),
                description: document.getElementById('description').value
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<p>正在检查...</p>';
            
            try {
                const response = await fetch('/api/conflict-check/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.code === 0) {
                    displayResult(data.data);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<p>错误：${data.msg}</p>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<p>请求失败：${error.message}</p>`;
            }
        });
        
        function displayResult(data) {
            const resultDiv = document.getElementById('result');
            
            if (data.has_conflict) {
                resultDiv.className = 'result warning';
                resultDiv.innerHTML = `
                    <h3>⚠️ 检测到潜在的利益冲突！</h3>
                    <p><strong>冲突等级：</strong> ${getConflictLevelTag(data.conflict_level)}</p>
                    <p>请查看下方详细信息，并咨询合规部门进行进一步评估。</p>
                    
                    ${data.conflicts.length > 0 ? `
                        <h4>冲突详情：</h4>
                        <table class="conflict-table">
                            <thead>
                                <tr>
                                    <th>冲突类型</th>
                                    <th>相关实体</th>
                                    <th>关联项目</th>
                                    <th>风险等级</th>
                                    <th>描述</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.conflicts.map(conflict => `
                                    <tr>
                                        <td>${conflict.type}</td>
                                        <td>${conflict.entity}</td>
                                        <td>${conflict.project}</td>
                                        <td>${getConflictLevelTag(conflict.level)}</td>
                                        <td>${conflict.description}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    ` : ''}
                `;
            } else {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h3>✅ 未检测到利益冲突</h3>
                    <p>该项目的利益冲突检查结果为安全。</p>
                `;
            }
        }
        
        function getConflictLevelTag(level) {
            const tags = {
                'none': '<span class="tag" style="background: #f6ffed; color: #52c41a;">无冲突</span>',
                'low': '<span class="tag tag-low">低风险</span>',
                'medium': '<span class="tag tag-medium">中风险</span>',
                'high': '<span class="tag tag-high">高风险</span>'
            };
            return tags[level] || level;
        }
        
        function loadTestData() {
            document.getElementById('projectName').value = '测试项目';
            document.getElementById('clientName').value = '测试客户';
            document.getElementById('oppositeParties').value = '某公司';
            document.getElementById('projectType').value = 'CIVIL';
            document.getElementById('description').value = '这是一个包含冲突的测试项目';
            
            // 选择前两个团队成员
            const options = document.getElementById('teamMembers').options;
            options[0].selected = true;
            options[1].selected = true;
        }
    </script>
</body>
</html>
