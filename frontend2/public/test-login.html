<!DOCTYPE html>
<html>
<head>
    <title>登录测试</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>登录测试页面</h1>
    <div>
        <label>用户名: <input type="text" id="username" value="admin"></label><br><br>
        <label>密码: <input type="password" id="password" value="admin123"></label><br><br>
        <button onclick="testLogin()">测试登录</button>
    </div>
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '正在测试登录...';
            
            try {
                // 测试直接登录API
                const directResponse = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const directData = await directResponse.json();
                
                if (directData.code === 0) {
                    resultDiv.innerHTML = `
                        <h3>✅ 登录成功！</h3>
                        <p>Token: ${directData.data.token}</p>
                        <p>现在测试获取用户信息...</p>
                    `;
                    
                    // 测试获取用户信息
                    const userInfoResponse = await fetch('/api/getInfo', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${directData.data.token}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const userInfo = await userInfoResponse.json();
                    
                    if (userInfo.code === 0) {
                        resultDiv.innerHTML += `
                            <h3>✅ 获取用户信息成功！</h3>
                            <pre>${JSON.stringify(userInfo, null, 2)}</pre>
                        `;
                    } else {
                        resultDiv.innerHTML += `<p>❌ 获取用户信息失败: ${userInfo.msg}</p>`;
                    }
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ 登录失败: ${directData.msg}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ 请求异常: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
