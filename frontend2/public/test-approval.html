<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审批功能测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }
        .test-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #333;
        }
        .btn {
            padding: 8px 16px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        .btn-success {
            background: #52c41a;
            color: white;
        }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success {
            color: #52c41a;
        }
        .error {
            color: #ff4d4f;
        }
        .approval-list {
            margin-top: 15px;
        }
        .approval-item {
            padding: 10px;
            border: 1px solid #e8e8e8;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 12px;
            color: white;
        }
        .status-pending {
            background: #faad14;
        }
        .status-approved {
            background: #52c41a;
        }
        .status-rejected {
            background: #ff4d4f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>审批功能测试</h1>
        
        <div class="test-section">
            <div class="test-title">1. 获取待审批列表</div>
            <button class="btn btn-primary" onclick="getPendingApprovals()">获取待审批列表</button>
            <div id="pendingResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">2. 获取我的申请</div>
            <button class="btn btn-primary" onclick="getMyApprovals()">获取我的申请</button>
            <div id="myResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">3. 创建新申请</div>
            <button class="btn btn-primary" onclick="createApproval()">创建测试申请</button>
            <div id="createResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">4. 审批操作</div>
            <input type="number" id="approvalId" placeholder="审批ID" style="padding: 5px; margin: 5px;">
            <input type="text" id="comment" placeholder="审批意见" style="padding: 5px; margin: 5px; width: 200px;">
            <br>
            <button class="btn btn-success" onclick="approveApproval()">批准</button>
            <button class="btn btn-danger" onclick="rejectApproval()">拒绝</button>
            <div id="actionResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">5. 获取统计数据</div>
            <button class="btn btn-primary" onclick="getStats()">获取统计</button>
            <div id="statsResult" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8082';
        
        async function apiCall(url, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${url}`, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                const data = await response.json();
                return { success: true, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        function displayResult(elementId, result) {
            const element = document.getElementById(elementId);
            if (result.success) {
                element.innerHTML = `<span class="success">✓ 成功</span>\n${JSON.stringify(result.data, null, 2)}`;
                element.className = 'result success';
            } else {
                element.innerHTML = `<span class="error">✗ 失败</span>\n${result.error}`;
                element.className = 'result error';
            }
        }
        
        async function getPendingApprovals() {
            const result = await apiCall('/approvals/pending');
            displayResult('pendingResult', result);
        }
        
        async function getMyApprovals() {
            const result = await apiCall('/approvals/my');
            displayResult('myResult', result);
        }
        
        async function createApproval() {
            const approvalData = {
                type: '测试申请',
                title: 'API测试申请 ' + new Date().toLocaleTimeString(),
                content: '这是一个通过API创建的测试申请',
                applicant: 'API测试用户',
                applicantId: 1,
                department: '技术部',
                urgency: 'normal'
            };
            const result = await apiCall('/approvals', {
                method: 'POST',
                body: JSON.stringify(approvalData)
            });
            displayResult('createResult', result);
        }
        
        async function approveApproval() {
            const id = document.getElementById('approvalId').value;
            const comment = document.getElementById('comment').value || '同意';
            if (!id) {
                alert('请输入审批ID');
                return;
            }
            const result = await apiCall(`/approvals/${id}/approve`, {
                method: 'POST',
                body: JSON.stringify({ comment })
            });
            displayResult('actionResult', result);
        }
        
        async function rejectApproval() {
            const id = document.getElementById('approvalId').value;
            const comment = document.getElementById('comment').value || '拒绝';
            if (!id) {
                alert('请输入审批ID');
                return;
            }
            const result = await apiCall(`/approvals/${id}/reject`, {
                method: 'POST',
                body: JSON.stringify({ comment })
            });
            displayResult('actionResult', result);
        }
        
        async function getStats() {
            const result = await apiCall('/approvals/stats');
            displayResult('statsResult', result);
        }
        
        // 页面加载时自动获取一些数据
        window.onload = function() {
            getPendingApprovals();
            getMyApprovals();
            getStats();
        };
    </script>
</body>
</html>
